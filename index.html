/* ----- item barcode / QR labels ----- */
const LBL_SIZES=[['50x30','50 × 30 mm label roll'],['40x25','40 × 25 mm label roll'],['58x40','58 × 40 mm label roll'],['a4','A4 sheet (cut out)']];
function labelsHtml(items,o){
  const a4=o.size==='a4',[w,h]=a4?[50,30]:o.size.split('x').map(Number);let out='';
  items.forEach(it=>{for(let n=0;n<o.copies;n++){
    const code=scanCode(it),price='Rs '+fmt(num(it.sell));
    out+=o.type==='qr'?`<div class="plbl qr" style="width:${w}mm;height:${h}mm"><div class="pl-q">${qrSVG(code,Math.round((h-4)*3.78))}</div><div class="pl-t"><div class="pl-n">${esc(it.name)}</div><div class="pl-p">${price}</div><div class="pl-c">${esc(code)}</div></div></div>`
      :`<div class="plbl bar" style="width:${w}mm;height:${h}mm"><div class="pl-n">${esc(it.name)}</div><div class="pl-b">${code128SVG(code,Math.max(16,Math.round((h-21)*3.78)))}</div><div class="pl-c">${esc(code)}</div><div class="pl-p">${price}</div></div>`}});
  return `<div class="lblsheet ${a4?'a4':'roll'}">${out}</div>`;
}
function labelPrint(items,o){printRaw(labelsHtml(items,o),{page:o.size==='a4'?'A4':(o.size.split('x')[0]+'mm '+o.size.split('x')[1]+'mm'),margin:o.size==='a4'?'8mm':'0',cls:'lblmode'})}
A.itemLabel=d=>{
  const one=d.id!=='all',it=one?DB.items.find(x=>x.id===d.id):null;
  modal(`<h3>${one?'Print label · '+esc(it.name):'Print labels for all items'}</h3><p class="mut sm" style="margin:0 0 10px">Scanner code: ${one?'<b>'+esc(scanCode(it))+'</b>':'each item’s barcode, or its item code if empty'}.</p>
  ${SEL('lb_type','Label type',opts([['bar','Barcode (Code 128)'],['qr','QR code']],'bar'))}${SEL('lb_size','Label size',opts(LBL_SIZES,'50x30'))}${F('lb_n','Copies of each label',{type:'number',v:'1',attr:'min="1" max="500"'})}
  <div class="row end"><button class="btn ghost s" data-a="closeModal">Cancel</button><button class="btn s" data-a="labelGo" data-id="${d.id}">Print</button></div>`);
};
A.labelGo=d=>{
  const list=d.id==='all'?mine('items').filter(i=>i.active!==false).sort((a,b)=>a.name.localeCompare(b.name)):[DB.items.find(x=>x.id===d.id)].filter(Boolean);
  if(!list.length)return toast('No items to print.','err');
  const o={type:V('lb_type'),size:V('lb_size'),copies:Math.max(1,Math.min(500,Math.floor(num(V('lb_n')))||1))};closeModal();labelPrint(list,o);
};

/* ---------- STOCK / SALE-PURCHASE / ITEM LEDGER REPORTS ---------- */
function stockData(){
  const L=stockLedger(mine('trades'),R.to);
  return mine('items').filter(i=>inSel('item',i.id)).sort((a,b)=>a.name.localeCompare(b.name)).map(i=>{const s=L.stock[i.id]||{qty:0,value:0};return{i,qty:s.qty,value:s.value,avg:s.qty>0?s.value/s.qty:0}}).filter(r=>r.qty||r.value||num(r.i.openQty));
}
function stockHtml(){
  const rows=stockData(),tv=sumP(rows,r=>r.value);
  return repHead('Stock report','As at '+dmy(R.to)+' · '+esc(msLabel('item')))+(rows.length?`<div class="tw"><table class="tbl"><thead><tr><th>Item</th><th>Category</th><th>Unit</th><th class="r">Qty</th><th class="r">Avg cost</th><th class="r">Stock value</th><th class="r">Sale price</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.i.name)}<div class="mut sm">${esc(r.i.code)}</div></td><td>${esc(r.i.category)}</td><td>${esc(r.i.unit)}</td><td class="r ${r.qty<0||(num(r.i.min)>0&&r.qty<=num(r.i.min))?'neg':''}">${fq(r.qty)}</td><td class="r">${fmt(r.avg)}</td><td class="r">${fmt(r.value)}</td><td class="r">${fmt(num(r.i.sell))}</td></tr>`).join('')}<tr class="tot"><td colspan="5">Total stock value</td><td class="r">${fmt(tv)}</td><td></td></tr></tbody></table></div><p class="mut sm">Red quantity = below the low-stock alert (or negative).</p>`:'<div class="empty small">No stock found.</div>');
}
function stockCSV(){const rows=[['Code','Item','Category','Unit','Qty','Avg cost','Stock value','Sale price','Min stock','As at']];stockData().forEach(r=>rows.push([r.i.code,r.i.name,r.i.category,r.i.unit,r.qty,r.avg?r2(r.avg):'',r.value,r.i.sell,r.i.min||'',R.to]));download('stock-report.csv',toCSV(rows),'text/csv',true)}
P['r-stock']={f:()=>{rInit();return repPage('Stock report',`${dateF('As at date','to')}${msBtn('item','Items')}`,stockHtml,stockCSV)},mod:'trade',perm:'r-stock'};

const TKSEL=[['S','Sales (sale − returns)'],['P','Purchases (purchase − returns)'],['sale','Sale invoices only'],['salereturn','Sale returns only'],['purchase','Purchase invoices only'],['purchasereturn','Purchase returns only']];
const kindOK=(k,f)=>f==='S'?isSale(k):f==='P'?!isSale(k):k===f;
function tradeRepData(){
  const trs=mine('trades').filter(t=>t.date>=R.from&&t.date<=R.to&&kindOK(t.kind,R.tk)&&inSel('party',t.party)).sort((a,b)=>a.date.localeCompare(b.date)||a.no.localeCompare(b.no));
  const L=stockLedger(mine('trades')),inv=trs.map(t=>{const c=tCalc(t),s=TK[t.kind].s;return{t,s,total:c.total*s,paid:c.paid*s,due:c.due*s}});
  const m={};
  trs.forEach(t=>{const s=TK[t.kind].s;t.rows.forEach((r,ix)=>{if(!inSel('item',r.item))return;const x=m[r.item]=m[r.item]||{item:r.item,qty:0,amt:0,cost:0,sale:false};x.qty+=s*num(r.qty);x.amt+=s*lineNet(r);if(isSale(t.kind)){x.sale=true;x.cost+=s*((L.costs[t.id]||[])[ix]||0)}})});
  return{inv,items:Object.values(m).sort((a,b)=>itemName(a.item).localeCompare(itemName(b.item)))};
}
function tradeRepHtml(){
  const d=tradeRepData(),tl=(TKSEL.find(x=>x[0]===R.tk)||[0,''])[1];
  if(R.tv==='item'){
    return repHead('Sale / purchase report · item-wise',esc(tl)+' · '+dmy(R.from)+' to '+dmy(R.to))+(d.items.length?`<div class="tw"><table class="tbl"><thead><tr><th>Item</th><th>Unit</th><th class="r">Qty</th><th class="r">Amount</th><th class="r">Cost</th><th class="r">Profit</th></tr></thead><tbody>${d.items.map(x=>`<tr><td>${esc(itemName(x.item))}</td><td>${esc(itemUnit(x.item))}</td><td class="r">${fq(x.qty)}</td><td class="r">${fmt(x.amt)}</td><td class="r">${x.sale?fmt(x.cost):''}</td><td class="r ${x.amt-x.cost<0?'neg':''}">${x.sale?fmt(x.amt-x.cost):''}</td></tr>`).join('')}<tr class="tot"><td colspan="3">Total</td><td class="r">${fmt(sumP(d.items,x=>x.amt))}</td><td class="r">${fmt(sumP(d.items.filter(x=>x.sale),x=>x.cost))}</td><td class="r">${fmt(sumP(d.items.filter(x=>x.sale),x=>x.amt-x.cost))}</td></tr></tbody></table></div><p class="mut sm">Amounts are line amounts before invoice-level discount, tax and charges. Profit = sale amount − average cost of the goods sold.</p>`:'<div class="empty small">Nothing found in this period.</div>');
  }
  return repHead('Sale / purchase report · invoices',esc(tl)+' · '+dmy(R.from)+' to '+dmy(R.to))+(d.inv.length?`<div class="tw"><table class="tbl"><thead><tr><th>Date</th><th>Invoice</th><th>Type</th><th>Party</th><th class="r">Total</th><th class="r">Paid / received</th><th class="r">Balance</th></tr></thead><tbody>${d.inv.map(x=>`<tr><td>${dmy(x.t.date)}</td><td>${esc(x.t.no)}</td><td>${TK[x.t.kind].v}</td><td>${esc(partyName(x.t.party)||'Cash')}</td><td class="r">${fmt(x.total)}</td><td class="r">${fmt(x.paid)}</td><td class="r">${fmt(x.due)}</td></tr>`).join('')}<tr class="tot"><td colspan="4">Total</td><td class="r">${fmt(sumP(d.inv,x=>x.total))}</td><td class="r">${fmt(sumP(d.inv,x=>x.paid))}</td><td class="r">${fmt(sumP(d.inv,x=>x.due))}</td></tr></tbody></table></div>`:'<div class="empty small">No invoices in this period.</div>');
}
function tradeRepCSV(){
  const d=tradeRepData(),rows=[];
  if(R.tv==='item'){rows.push(['Item code','Item','Category','Unit','Qty','Amount','Cost','Profit','From','To']);d.items.forEach(x=>{const it=itemById(x.item)||{};rows.push([it.code||'',it.name||'',it.category||'',it.unit||'',x.qty,x.amt,x.sale?x.cost:'',x.sale?r2(x.amt-x.cost):'',R.from,R.to])})}
  else{rows.push(['Date','Month','Invoice #','Type','Party','Party type','Total','Paid / received','Balance']);d.inv.forEach(x=>rows.push([x.t.date,monthOf(x.t.date),x.t.no,TK[x.t.kind].v,partyName(x.t.party),partyType(x.t.party),x.total,x.paid,x.due]))}
  download('sale-purchase-report.csv',toCSV(rows),'text/csv',true);
}
P['r-trade']={f:()=>{rInit();return repPage('Sale / purchase report',`<div class="g2 rs">${dateF('Date from','from')}${dateF('Date to','to')}</div><div class="g2 rs">${SEL('r_tk','Type',opts(TKSEL,R.tk),`onchange="R.tk=this.value;repRefresh()"`)}${SEL('r_tv','View',opts([['inv','Invoice-wise'],['item','Item-wise (with profit)']],R.tv),`onchange="R.tv=this.value;repRefresh()"`)}</div>${msBtn('party','Customers / suppliers')}${msBtn('item','Items')}`,tradeRepHtml,tradeRepCSV)},mod:'trade',perm:'r-trade'};

function itemLedData(){
  const L=stockLedger(mine('trades')),mv=L.moves.filter(m=>m.item===R.itemId);
  const before=mv.filter(m=>m.date<R.from),open=before.length?before[before.length-1].bal:0,per=mv.filter(m=>m.date>=R.from&&m.date<=R.to);
  return{open,per,close:per.length?per[per.length-1].bal:open};
}
function itemLedHtml(){
  if(!R.itemId)return '<div class="empty small">Select an item to see its stock movement.</div>';
  const d=itemLedData(),u=esc(itemUnit(R.itemId));
  return repHead('Item ledger',esc(itemName(R.itemId))+' · '+dmy(R.from)+' to '+dmy(R.to))+kv('Opening qty',d.open)+kv('Closing qty',d.close,'big')+`<div class="tw"><table class="tbl"><thead><tr><th>Date</th><th>Ref</th><th>Type</th><th>Party</th><th class="r">In</th><th class="r">Out</th><th class="r">Rate</th><th class="r">Balance (${u})</th></tr></thead><tbody>${d.per.map(m=>`<tr><td>${dmy(m.date)}</td><td>${esc(m.no)}</td><td>${esc(m.type)}</td><td>${esc(m.party)}</td><td class="r">${m.inq?fq(m.inq):''}</td><td class="r">${m.outq?fq(m.outq):''}</td><td class="r">${fmt(m.rate)}</td><td class="r">${fq(m.bal)}</td></tr>`).join('')||'<tr><td colspan="8" class="mut">No movement in this period.</td></tr>'}</tbody></table></div>`;
}
function itemLedCSV(){if(!R.itemId)return toast('Select an item first.','err');const d=itemLedData(),rows=[['Date','Ref','Type','Party','In','Out','Rate','Balance'],['','','Opening','','','','',d.open]];d.per.forEach(m=>rows.push([m.date,m.no,m.type,m.party,m.inq||'',m.outq||'',m.rate,m.bal]));download('item-ledger.csv',toCSV(rows),'text/csv',true)}
P['r-itemled']={f:()=>{rInit();return repPage('Item ledger',`<div class="g2 rs">${dateF('Date from','from')}${dateF('Date to','to')}</div>${SEL('r_item','Item',opts(mine('items').slice().sort((a,b)=>a.name.localeCompare(b.name)).map(i=>[i.id,i.name]),R.itemId,'Select item'),`onchange="R.itemId=this.value;repRefresh()"`)}`,itemLedHtml,itemLedCSV)},mod:'trade',perm:'r-itemled'};


/* ================= HELP & SUPPORT TICKETS ================= */
const TKC=['Question','Problem / error','Request','Other'];
const TKS={open:'<span class="badge st-pending">Open</span>',replied:'<span class="badge st-full">Replied</span>',closed:'<span class="badge st-suspended">Closed</span>'};
const tkSort=(a,b)=>(a.status==='closed')-(b.status==='closed')||b.upd-a.upd;
function openTk(){return DB.tickets.filter(t=>t.status==='open').length}
let TKF='open';
function tkRow(t,adm){return `<button type="button" class="tk" data-a="tkOpen" data-id="${t.id}"><div class="t"><b>${esc(t.no)} · ${esc(t.subject)}</b>${TKS[t.status]}</div><span class="mut sm">${adm?esc(cName(t.companyId))+' · '+esc(t.userName)+' · ':''}${esc(t.cat)} · ${dts(t.upd)}</span></button>`}
function tkMine(){const u=me();return DB.tickets.filter(t=>t.companyId===CID()&&(u.role==='owner'||t.userId===u.id)).sort(tkSort)}
function tkList(){
  if(isSuper()){const l=DB.tickets.filter(t=>TKF==='all'||t.status===TKF).sort(tkSort);return l.length?l.map(t=>tkRow(t,true)).join(''):'<div class="empty small">No tickets here.</div>'}
  const l=tkMine();return l.length?l.map(t=>tkRow(t,false)).join(''):'<div class="empty small">You have not raised any ticket yet.</div>';
}
function tkDash(){const l=DB.tickets.filter(t=>t.status==='open').sort((a,b)=>b.upd-a.upd).slice(0,6);return l.length?l.map(t=>tkRow(t,true)).join(''):'<div class="empty small">No tickets waiting for a reply.</div>'}
function tkRefresh(){
  const a=$('#tklist');if(a)a.innerHTML=tkList();const b=$('#tkdash');if(b)b.innerHTML=tkDash();
  const n=$('#tkcount');if(n)n.textContent=openTk();
  if(isSuper()){const h=(location.hash||'').replace(/^#\//,'').split('?')[0],sd=$('#side');if(sd)sd.innerHTML=sideSuper(SP[h]?(SP[h].nav||h):'s-companies')}
}
function tkAllowed(t){if(!t)return false;if(isSuper())return true;const u=me();return t.companyId===CID()&&(u.role==='owner'||t.userId===u.id)}
function tkModal(id){
  const t=DB.tickets.find(x=>x.id===id);if(!tkAllowed(t))return;const adm=isSuper(),u=me();
  modal(`<h3>${esc(t.no)} · ${esc(t.subject)}</h3><div class="mut sm">${adm?esc(cName(t.companyId))+' · '+esc(t.userName)+' · ':''}${esc(t.cat)} · ${dts(t.at)} ${TKS[t.status]}</div><div style="max-height:42vh;overflow:auto;margin:6px 0">${t.msgs.map(m=>`<div class="tkm ${m.by==='admin'?'a':'u'}"><small>${m.by==='admin'?'BIZEASE SOLUTIONS':(!adm&&u&&m.uid===u.id?'You':esc(m.name))} · ${dts(m.at)}</small>${esc(m.text)}</div>`).join('')}</div>${t.status==='closed'?'':`<div class="fld"><label for="tk_re">Your reply</label><textarea id="tk_re" rows="3"></textarea></div>`}<div class="row end fw">${t.status==='closed'?`<button class="btn ghost s" data-a="tkReopen" data-id="${t.id}">Reopen</button>`:`<button class="btn ghost s" data-a="tkClose" data-id="${t.id}">Close ticket</button><button class="btn s" data-a="tkReply" data-id="${t.id}">Send reply</button>`}<button class="btn ghost s" data-a="closeModal">Back</button></div>`);
}
A.tkOpen=d=>tkModal(d.id);
A.tkNew=()=>{
  const cat=V('tk_cat')||TKC[0],sub=V('tk_sub'),msg=V('tk_msg'),u=me();
  if(!sub)return toast('Please write a subject.','err');
  if(!msg)return toast('Please describe your issue.','err');
  const now=Date.now();DB.seq.tk=(DB.seq.tk||0)+1;
  const t={id:uid(),no:'TK-'+String(DB.seq.tk).padStart(4,'0'),companyId:CID(),userId:u.id,userName:u.name,cat,subject:sub,status:'open',at:now,upd:now,msgs:[{by:'user',uid:u.id,name:u.name,text:msg,at:now}]};
  DB.tickets.push(t);logAct('Support ticket raised',t.no+' · '+sub);save();toast('Ticket '+t.no+' submitted. BIZEASE SOLUTIONS will reply soon.');
  $('#tk_sub').value='';$('#tk_msg').value='';tkRefresh();
};
A.tkReply=d=>{
  const t=DB.tickets.find(x=>x.id===d.id);if(!tkAllowed(t))return;const txt=V('tk_re');if(!txt)return toast('Please write your reply.','err');
  const adm=isSuper(),u=me(),now=Date.now();
  t.msgs.push(adm?{by:'admin',name:'BIZEASE SOLUTIONS',text:txt,at:now}:{by:'user',uid:u.id,name:u.name,text:txt,at:now});
  t.status=adm?'replied':'open';t.upd=now;save();toast('Reply sent.');tkModal(t.id);tkRefresh();
};
A.tkClose=d=>{const t=DB.tickets.find(x=>x.id===d.id);if(!tkAllowed(t))return;t.status='closed';t.upd=Date.now();save();toast('Ticket closed.');closeModal();tkRefresh()};
A.tkReopen=d=>{const t=DB.tickets.find(x=>x.id===d.id);if(!tkAllowed(t))return;t.status='open';t.upd=Date.now();save();toast('Ticket reopened.');tkModal(t.id);tkRefresh()};
function pageHelp(){
  return `<div class="ph"><h1>Help &amp; support</h1><p>Raise a ticket and BIZEASE SOLUTIONS will reply, or contact us directly.</p></div>
  <div class="card"><h3>Contact BIZEASE SOLUTIONS</h3>
  <div class="item"><div class="l"><b>Phone</b><span><a href="tel:${BZ.tel}">${BZ.phone}</a></span></div></div>
  <div class="item"><div class="l"><b>Email</b><span><a href="mailto:${BZ.email}">${BZ.email}</a></span></div></div>
  <div class="item"><div class="l"><b>Website</b><span><a href="${BZ.web}" target="_blank" rel="noopener">${BZ.webShow}</a></span></div></div></div>
  <div class="card"><h3>Raise a ticket</h3>${SEL('tk_cat','Category',opts(TKC,'Question'))}${F('tk_sub','Subject')}<div class="fld"><label for="tk_msg">Describe your issue</label><textarea id="tk_msg" rows="5"></textarea></div><button class="btn" data-a="tkNew">Submit ticket</button></div>
  <div class="card"><h3>My tickets</h3><div id="tklist">${tkList()}</div></div>`;
}
P.help={f:pageHelp};
function pageSTickets(){
  return `<div class="ph"><h1>Support tickets</h1><p>Tickets raised by companies from their Help tab.</p></div><div class="card"><div class="fld" style="margin:0"><label>Show</label><select onchange="TKF=this.value;tkRefresh()">${opts([['open','Awaiting reply'],['replied','Replied'],['closed','Closed'],['all','All tickets']],TKF)}</select></div></div><div class="card" id="tklist">${tkList()}</div>`;
}
SP['s-tickets']={f:pageSTickets};

/* ================= PLAN, BILLS & REQUESTS (company admin) ================= */
const RQST={pending:'<span class="badge st-pending">Pending</span>',approved:'<span class="badge st-full">Approved</span>',rejected:'<span class="badge st-suspended">Rejected</span>'};
function rqText(r){return r.type==='name'?`Name change: <b>${esc(r.data.oldName||'')}</b> → <b>${esc(r.data.newName)}</b>`:`Plan request: <b>${ST[r.data.plan]}</b> · ${r.data.users} user(s) · ${r.data.mods.length?esc(r.data.mods.map(m=>(MODS.find(x=>x[0]===m)||[0,m])[1]).join(', ')):'basic modules'}${r.data.note?' · “'+esc(r.data.note)+'”':''}`}
function pagePlan(){
  const c=co(),bills=DB.billing.filter(b=>b.companyId===c.id).sort((a,b)=>b.dueDate.localeCompare(a.dueDate)),
    rqs=DB.requests.filter(r=>r.companyId===c.id).sort((a,b)=>b.at-a.at),pend=rqs.find(r=>r.type==='plan'&&r.status==='pending');
  const nUsers=DB.users.filter(u=>u.companyId===c.id).length;
  return `<div class="ph"><h1>Plan, bills &amp; requests</h1><p>Your current plan, your bills, and requests to BIZEASE Solutions.</p></div>
  <div class="card"><h3>Current plan</h3>
  <div class="item"><span>Status</span><span class="badge st-${c.status}">${ST[c.status]}</span></div>
  <div class="item"><span>Users</span><b>${nUsers} / ${c.maxUsers}</b></div>
  <div class="item"><span>Modules</span><span class="r sm" style="max-width:60%">${esc(modsText(c))}</span></div>
  ${c.status==='trial'?`<div class="item"><span>Trial left</span><b>${daysLeft(c)} day(s)</b></div>`:`<div class="item"><span>Monthly fee</span><b>${c.fee?money(c.fee):'—'}</b></div><div class="item"><span>Next due date</span><b>${c.nextDue?dmy(c.nextDue):'—'}</b></div>`}</div>
  <div class="card"><h3>Your bills</h3>${bills.length?bills.map(b=>billCard(b,false)).join(''):'<div class="empty small">No bills yet. Your monthly bill is generated automatically '+BILL_ADVANCE+' days before the due date.</div>'}</div>
  <div class="card"><h3>Request a plan</h3>${pend?`<div class="banner info">${ic('clock',16)}<div>Your plan request is waiting for admin approval.</div></div>`:`<p class="mut sm" style="margin:0 0 10px">Choose what you need. BIZEASE Solutions will confirm the monthly fee and due date when they approve it.</p>
  ${SEL('pr_plan','Plan',opts([['partial','Partial access'],['full','Full access']],'full'))}${F('pr_users','Number of users needed',{type:'number',v:Math.max(nUsers,c.maxUsers),attr:'min="1" inputmode="numeric"'})}<div class="lbl">Modules needed</div>${MODS.map(m=>`<label class="chk"><input type="checkbox" class="rmod" data-m="${m[0]}" ${c.modules.includes(m[0])?'checked':''}>${m[1]}</label>`).join('')}${F('pr_note','Note (optional)')}<button class="btn" data-a="planReq">Send request</button>`}</div>
  <div class="card"><h3>Request history</h3>${rqs.length?rqs.map(r=>`<div class="item"><div class="l"><span>${rqText(r)}</span><span class="mut sm">${dts(r.at)}</span></div><div class="rt">${RQST[r.status]}</div></div>`).join(''):'<div class="empty small">No requests yet.</div>'}</div>`;
}
A.planReq=()=>{
  const c=co(),users=Math.floor(num(V('pr_users')));if(users<1)return toast('Enter the number of users.','err');
  if(DB.requests.some(r=>r.companyId===c.id&&r.type==='plan'&&r.status==='pending'))return toast('You already have a pending request.','err');
  const data={plan:V('pr_plan'),users,mods:$$('.rmod').filter(b=>b.checked).map(b=>b.dataset.m),note:V('pr_note')};
  DB.requests.push({id:uid(),companyId:c.id,userId:me().id,type:'plan',status:'pending',at:Date.now(),data});
  logAct('Plan requested',ST[data.plan]+', '+users+' user(s)');save();toast('Request sent to admin.');render();
};
A.billPrint=d=>printHTML(billHtml(DB.billing.find(x=>x.id===d.id)));
P.plan={f:pagePlan,admin:true};

/* ================= USER ACTIVITY LOG ================= */
const LF={u:'',from:'',to:'',q:''};
function logRows(cid,f){f=f||{};const q=(f.q||'').toLowerCase();const hide=new Set(['super']);/* super admin activity is never shown to anyone */
  if(!isSuper()){const vu=me();if(vu&&vu.role!=='owner')DB.users.forEach(x=>{if(x.companyId===cid&&x.role==='owner')hide.add(x.id)})}/* admin activity is not shown on the user side */
  return DB.logs.filter(l=>l.companyId===cid&&!hide.has(l.userId)&&(!f.u||l.userId===f.u)&&(!f.from||ymd(new Date(l.at))>=f.from)&&(!f.to||ymd(new Date(l.at))<=f.to)&&(!q||(l.name+' '+l.action+' '+l.detail).toLowerCase().includes(q))).sort((a,b)=>b.at-a.at)}
function logTable(rows,max){
  if(!rows.length)return '<div class="empty small">No activity found.</div>';
  const shown=rows.slice(0,max||200);
  return `<div class="tw"><table class="tbl"><thead><tr><th>Date &amp; time</th><th>User</th><th>Action</th><th>Details</th></tr></thead><tbody>${shown.map(l=>`<tr><td style="white-space:nowrap">${dts(l.at)}</td><td>${esc(l.name)}</td><td><b>${esc(l.action)}</b></td><td>${esc(l.detail)}</td></tr>`).join('')}</tbody></table></div>${rows.length>shown.length?`<p class="mut sm">Showing latest ${shown.length} of ${rows.length}. Narrow the filters or export to Excel.</p>`:''}`;
}
const logRefresh=()=>{$('#logout').innerHTML=logTable(logRows(CID(),LF))};
function pageLog(){
  const us=DB.users.filter(u=>u.companyId===CID()&&(me().role==='owner'||u.role!=='owner'));
  return `<div class="ph"><h1>User Activity Log</h1><p>Who did what and when: logins, entries, edits and deletions.</p></div>
  <div class="card"><div class="g2 rs">${SEL('lf_u','User',opts(us.map(u=>[u.id,u.name]),LF.u,'All users'),`onchange="LF.u=this.value;logRefresh()"`)}<div class="fld"><label>Search</label><input type="search" value="${esc(LF.q)}" oninput="LF.q=this.value;logRefresh()" placeholder="Action or detail"></div></div>
  <div class="g2 rs"><div class="fld"><label>From</label><input type="date" value="${LF.from}" onchange="LF.from=this.value;logRefresh()"></div><div class="fld"><label>To</label><input type="date" value="${LF.to}" onchange="LF.to=this.value;logRefresh()"></div></div>
  <button class="btn ghost s" data-a="logCSV">${ic('download',15)}Export Excel</button></div>
  <div class="card" id="logout">${logTable(logRows(CID(),LF))}</div>`;
}
A.logCSV=()=>{const rows=[['Date & time','User','Action','Details']];logRows(CID(),LF).forEach(l=>rows.push([dts(l.at),l.name,l.action,l.detail]));download('user-log-'+today()+'.csv',toCSV(rows),'text/csv',true)};
P.log={f:pageLog,perm:'log'};

/* ================= MY ACCOUNT ================= */
function pageAccount(){
  const u=me(),ow=u.role==='owner';
  return `<div class="ph"><h1>My account</h1></div>
  <div class="dgrid two"><div class="card"><h3>My details</h3>${F('ac_name','Full name',{v:u.name})}${F('ac_cell','Cell',{v:u.cell,type:'tel'})}${F('ac_email','Email (login ID)',{v:u.email,attr:'disabled'})}<button class="btn" data-a="acSave">Save details</button></div>
  <div class="card"><h3>Change password</h3>${F('ac_old','Current password',{type:'password'})}${F('ac_new','New password',{type:'password'})}<button class="btn" data-a="acPass">Change password</button></div></div>
  ${ow?`<div class="card" style="margin-top:12px"><h3>Backup and restore</h3><p class="mut sm" style="margin:0 0 10px">Your data lives in this browser only. Download a backup regularly, and use it to move to a new phone.</p><button class="btn tan" data-a="bkExport">${ic('download',17)}Download backup</button><div style="height:10px"></div><label class="lbl">Restore from a backup file</label><input type="file" accept=".json" onchange="bkImport(this)"></div>`:''}`;
}
A.acSave=()=>{if(!V('ac_name'))return toast('Name cannot be empty.','err');const u=me();u.name=V('ac_name');u.cell=V('ac_cell');if(u.role==='owner'){co().owner=u.name;co().cell=u.cell}save();toast('Details saved.');render()};
A.acPass=()=>{const u=me(),np=$('#ac_new').value;if(pw($('#ac_old').value)!==u.pass)return toast('Current password is not correct.','err');if(np.length<4)return toast('New password needs at least 4 characters.','err');u.pass=pw(np);logAct('Password changed');save();toast('Password changed.');render()};
A.bkExport=()=>{const c=CID();download(`bizqist-${co().name.replace(/\W+/g,'-')}-${today()}.json`,JSON.stringify({app:'bizqist',v:3,company:co().name,coa:mine('coa'),parties:mine('parties'),qpays:mine('qpays'),entries:mine('entries'),vouchers:mine('vouchers'),costCenters:mine('costCenters'),items:mine('items'),trades:mine('trades'),sys:co().sys||null,negStock:!!co().negStock,cashHeads:co().cashHeads,receiptHeads:co().receiptHeads,paymentHeads:co().paymentHeads,seq:DB.seq[c]||{}}),'application/json')};
async function bkImport(inp){
  const f=inp.files[0];if(!f)return;let d;try{d=JSON.parse(await f.text());if((d.app!=='bizbook'&&d.app!=='bizqist')||!Array.isArray(d.entries))throw 0}catch(e){inp.value='';return toast('This is not a BIZQIST backup file.','err')}
  confirmBox('Replace all current books with this backup ('+esc(d.company||'unknown')+')? This cannot be undone.',()=>{const c=CID();d.costCenters=migrateCC(d.costCenters||[],[d.entries||[],d.vouchers||[]]);['coa','parties','entries','vouchers','costCenters','items','trades','qpays'].forEach(k=>{DB[k]=(DB[k]||[]).filter(x=>x.companyId!==c).concat((d[k]||[]).map(x=>({...x,companyId:c})))});co().sys=d.sys||co().sys;co().negStock=!!d.negStock;const def=DB.coa.filter(h=>h.companyId===c&&(h.type==='Cash'||h.type==='Bank')).map(h=>h.id),ch=Array.isArray(d.cashHeads)?d.cashHeads:def;co().receiptHeads=Array.isArray(d.receiptHeads)?d.receiptHeads:ch.slice();co().paymentHeads=Array.isArray(d.paymentHeads)?d.paymentHeads:ch.slice();syncCash(co());DB.seq[c]=d.seq||{};logAct('Backup restored');save();toast('Backup restored.');render()},'Restore');inp.value='';
}
P.account={f:pageAccount};

/* ================= SUPER ADMIN ================= */
const SF={q:'',st:''};
function cCard(c){
  const ow=DB.users.find(u=>u.companyId===c.id&&u.role==='owner')||{email:'-'},nu=DB.users.filter(u=>u.companyId===c.id).length,od=overdueBills(c).length,due=dueAmt(c.id);
  const paid=c.status==='full'||c.status==='partial';
  return `<div class="cc ${od?'flag':''}"><div class="row sb"><div style="min-width:0"><b style="font-size:16px;overflow-wrap:anywhere">${esc(c.name)}</b><div class="mut sm">${esc(c.owner)} · ${esc(c.cell)}</div></div><div style="text-align:right"><span class="badge st-${c.status}">${ST[c.status]}</span>${od?'<div style="margin-top:4px"><span class="badge st-suspended">Bill overdue: blocked</span></div>':''}</div></div>
  <dl><dt>City</dt><dd>${esc(c.city)} · ${esc(c.biz)}</dd><dt>Login ID</dt><dd>${esc(ow.email)}</dd><dt>Registered</dt><dd>${dts(c.regAt)}</dd><dt>Users</dt><dd><b>${nu}</b> / ${c.maxUsers}</dd><dt>Modules</dt><dd>${esc(modsText(c))}</dd>${c.status==='trial'?`<dt>Trial</dt><dd>${daysLeft(c)} day(s) left</dd>`:''}${paid?`<dt>Monthly fee</dt><dd>${c.fee?money(c.fee):'Not set'}</dd><dt>Next due</dt><dd>${c.nextDue?dmy(c.nextDue):'Not set'}</dd>`:''}<dt>Unpaid bills</dt><dd class="${due?'neg':''}"><b>${due?money(due):'None'}</b></dd>${c.autoSuspended&&c.status==='suspended'?'<dt>Note</dt><dd>Trial ended automatically</dd>':''}</dl>
  <div class="acts"><a class="btn s" href="#/s-company?id=${c.id}">Open details</a>${c.status==='pending'?`<button class="btn s" data-a="sApprove" data-id="${c.id}">${ic('check',15)}Approve</button>`:`<button class="btn tan s" data-a="sPlan" data-id="${c.id}">Plan &amp; limits</button>`}${c.status==='suspended'||c.status==='rejected'?`<button class="btn tan s" data-a="sPlan" data-id="${c.id}">Unblock</button>`:c.status!=='pending'?`<button class="btn ghost s" data-a="sBlock" data-id="${c.id}">Block</button>`:''}<button class="ib" data-a="sEdit" data-id="${c.id}" aria-label="Edit">${ic('edit',17)}</button><button class="ib red" data-a="sDel" data-id="${c.id}" aria-label="Delete">${ic('trash',17)}</button></div></div>`;
}
function sList(){
  const q=SF.q.toLowerCase();
  const l=DB.companies.filter(c=>(!SF.st||(SF.st==='overdue'?overdueBills(c).length>0:c.status===SF.st))&&(!q||[c.name,c.owner,c.cell,c.city].join(' ').toLowerCase().includes(q))).sort((a,b)=>b.regAt-a.regAt);
  if(!l.length)return '<div class="empty small">No companies found.</div>';
  return `<div class="cgrid">${l.map(cCard).join('')}</div>`;
}
function pageSCompanies(){
  const n=s=>DB.companies.filter(c=>c.status===s).length,od=DB.companies.filter(c=>overdueBills(c).length).length,out=DB.billing.filter(b=>b.status==='due').reduce((s,b)=>s+b.amount,0);
  return `<div class="ph"><h1>Companies</h1><p>Every registered company with its status, plan, users, billing and due dates.</p></div>
  <div class="cnt"><div><b>${DB.companies.length}</b><span>Total</span></div><div><b>${n('pending')}</b><span>Pending</span></div><div><b>${n('trial')}</b><span>Trial</span></div><div><b>${n('partial')}</b><span>Partial</span></div><div><b>${n('full')}</b><span>Full</span></div><div><b>${n('suspended')+od}</b><span>Blocked</span></div><div><b>${DB.users.length}</b><span>Users</span></div><div><b style="font-size:17px;padding-top:4px">${fmt(out)}</b><span>Unpaid bills</span></div></div>
  <div class="card"><div class="row sb"><h3>Support tickets (<span id="tkcount">${openTk()}</span> awaiting reply)</h3><a href="#/s-tickets" class="sm">View all</a></div><div id="tkdash">${tkDash()}</div></div>
  <div class="card"><div class="g2 rs"><div class="search" style="margin:0">${ic('search',18)}<input type="search" placeholder="Search company, name, cell" value="${esc(SF.q)}" oninput="SF.q=this.value;$('#slist').innerHTML=sList()"></div><select onchange="SF.st=this.value;$('#slist').innerHTML=sList()" aria-label="Filter">${opts([...Object.entries(ST),['overdue','Bill overdue']],SF.st,'All statuses')}</select></div><div class="row fw"><button class="btn s" data-a="sAdd">${ic('plus',15)}Add company</button><button class="btn ghost s" data-a="sCSV">${ic('download',15)}Export list</button></div></div>
  <div id="slist">${sList()}</div>
  <div class="card"><h3>How access works</h3><p class="mut sm" style="margin:0"><b>Pending:</b> a new company can log in but sees only “approval pending” until you approve it.<br><b>Plan &amp; limits:</b> you set the plan, user limit, modules, monthly fee and due date for each company.<br><b>Auto billing:</b> a bill is created ${BILL_ADVANCE} days before each due date. If it is unpaid after the due date, the account is blocked automatically. Mark the bill as paid and the account opens at once.<br><b>Auto billing runs whenever BIZQIST is opened</b> in the browser that holds the data.</p></div>`;
}
SP['s-companies']={f:pageSCompanies};
A.sCSV=()=>{const rows=[['Sr','Full name','Cell','Company','City','Business type','Login ID','Registered','Status','Users','Max users','Monthly fee','Next due','Unpaid']];DB.companies.forEach((c,i)=>{const ow=DB.users.find(u=>u.companyId===c.id&&u.role==='owner')||{};rows.push([i+1,c.owner,c.cell,c.name,c.city,c.biz,ow.email,dts(c.regAt),ST[c.status],DB.users.filter(u=>u.companyId===c.id).length,c.maxUsers,c.fee,c.nextDue,dueAmt(c.id)])});download('bizbook-companies.csv',toCSV(rows),'text/csv',true)};

/* --- plan & limits modal (also used for approvals) --- */
function plPreset(){const p=PLAN_DEF[V('pl_st')];if(!p)return;$('#pl_users').value=p.users;$$('.pmod').forEach(b=>b.checked=p.mods.includes(b.dataset.m))}
function planModal(cid,rid){
  const c=cById(cid),rq=rid?DB.requests.find(x=>x.id===rid):null,d=rq&&rq.type==='plan'?rq.data:null;
  const st0=d?d.plan:(['pending','rejected','suspended'].includes(c.status)?'trial':c.status),mods=d?d.mods:c.modules,users=d?d.users:c.maxUsers;
  modal(`<h3>Plan &amp; limits · ${esc(c.name)}</h3>${d?`<div class="banner info"><div><b>User asked for:</b> ${ST[d.plan]} · ${d.users} user(s) · ${d.mods.length?esc(d.mods.map(m=>(MODS.find(x=>x[0]===m)||[0,m])[1]).join(', ')):'basic modules'}${d.note?'<br>Note: '+esc(d.note):''}</div></div>`:''}
  ${SEL('pl_st','Plan / status',opts(PLANS.map(p=>[p,ST[p]]),st0),'onchange="plPreset()"')}${F('pl_users','Maximum users',{type:'number',v:users,attr:'min="1"'})}
  <div class="lbl">Modules allowed</div>${MODS.map(m=>`<label class="chk"><input type="checkbox" class="pmod" data-m="${m[0]}" ${mods.includes(m[0])?'checked':''}>${m[1]}</label>`).join('')}
  <div class="g2 rs" style="margin-top:8px">${F('pl_fee','Monthly fee (Rs)',{type:'number',v:c.fee||'',attr:'min="0" inputmode="decimal"'})}${F('pl_due','First / next due date',{type:'date',v:c.nextDue||addDays(today(),30)})}</div>
  ${F('pl_days','Trial days (used when starting a trial)',{type:'number',v:TRIAL_DAYS,attr:'min="1"'})}
  <label class="chk"><input type="checkbox" id="pl_bill" checked>Generate the bill now (paid plans with a monthly fee)</label>
  <p class="mut sm">Paid plans: the next bill is created automatically ${BILL_ADVANCE} days before each due date. The account is blocked if a bill is unpaid after its due date.</p>
  <div class="row end"><button class="btn ghost s" data-a="closeModal">Cancel</button><button class="btn s" data-a="plSave" data-id="${cid}" data-rid="${rid||''}">${rid||c.status==='pending'?'Approve &amp; save':'Save'}</button></div>`);
}
A.sApprove=d=>planModal(d.id);
A.sPlan=d=>planModal(d.id);
A.plSave=d=>{
  const c=cById(d.id),prev=c.status,st=V('pl_st'),users=Math.max(1,Math.floor(num(V('pl_users')))),mods=$$('.pmod').filter(b=>b.checked).map(b=>b.dataset.m);if(mods.includes('qist')&&!mods.includes('trade'))mods.push('trade');const fee=Math.max(0,num(V('pl_fee'))),due=V('pl_due');
  if(st!=='trial'&&fee>0&&!due)return toast('Choose the due date.','err');
  c.status=st;c.autoSuspended=false;c.maxUsers=users;c.modules=mods;c.fee=fee;c.nextDue=st==='trial'?'':(due||'');
  if(st==='trial'&&prev!=='trial')c.trialEnds=Date.now()+Math.max(1,num(V('pl_days')))*864e5;
  if(st!=='trial'&&fee>0&&c.nextDue&&$('#pl_bill').checked&&!DB.billing.some(b=>b.companyId===c.id&&b.monthly&&b.dueDate===c.nextDue))DB.billing.push(mkBill(c.id,fee,c.nextDue,'Monthly plan fee ('+ST[st]+')',true,false));
  if(d.rid){const rq=DB.requests.find(x=>x.id===d.rid);if(rq){rq.status='approved';rq.resolvedAt=Date.now()}}
  sLog(c.id,prev==='pending'?'Company approved':'Plan changed',ST[st]+' · '+users+' user(s) · fee '+fee);
  save();closeModal();toast(c.name+': '+ST[st]);render();
};
A.sBlock=d=>{const c=cById(d.id);confirmBox('Block <b>'+esc(c.name)+'</b>? Their users can log in but will only see a “blocked” message.',()=>{c.status='suspended';c.autoSuspended=false;sLog(c.id,'Company blocked','');save();toast('Company blocked.');render()},'Block')};
A.sEdit=d=>{const c=cById(d.id),ow=DB.users.find(u=>u.companyId===c.id&&u.role==='owner')||{};
  modal(`<h3>Edit company</h3>${F('se_co','Company name',{v:c.name})}${F('se_name','Owner full name',{v:c.owner})}${F('se_cell','Cell',{v:c.cell,type:'tel'})}${F('se_city','City',{v:c.city})}${SEL('se_biz','Business type',opts(BIZ,c.biz))}${F('se_email','Login ID',{v:ow.email})}${F('se_pass','Reset owner password (optional)',{type:'password'})}<div class="row end"><button class="btn ghost s" data-a="closeModal">Cancel</button><button class="btn s" data-a="sSave" data-id="${c.id}">Save changes</button></div>`)};
A.sSave=d=>{
  const c=cById(d.id),ow=DB.users.find(u=>u.companyId===c.id&&u.role==='owner'),n=V('se_co'),em=V('se_email').toLowerCase();
  if(!n||!em)return toast('Company name and login ID are required.','err');
  if(DB.companies.some(x=>x.id!==c.id&&x.name.toLowerCase()===n.toLowerCase()))return toast('Another company has this name.','err');
  if(em===DB.super.email.toLowerCase()||DB.users.some(u=>u!==ow&&u.companyId===ow.companyId&&u.email.toLowerCase()===em))return toast('This login ID is already taken.','err');
  const np=$('#se_pass').value;if(np&&np.length<4)return toast('Password needs at least 4 characters.','err');
  if(n!==c.name)sLog(c.id,'Company name changed by admin',c.name+' → '+n);
  Object.assign(c,{name:n,owner:V('se_name'),cell:V('se_cell'),city:V('se_city'),biz:V('se_biz')});
  if(ow){ow.email=em;ow.name=V('se_name');ow.cell=V('se_cell');if(np)ow.pass=pw(np)}
  save();closeModal();toast('Company updated.');render();
};
A.sDel=d=>{const c=cById(d.id);confirmBox('Delete <b>'+esc(c.name)+'</b> with all its users and data? This cannot be undone.',()=>{['users','coa','parties','entries','vouchers','costCenters','items','trades','qpays','billing','requests','logs','tickets'].forEach(k=>DB[k]=DB[k].filter(x=>x.companyId!==c.id));DB.companies=DB.companies.filter(x=>x.id!==c.id);delete DB.seq[c.id];save();toast('Company deleted.');go('s-companies')})};

A.sAddSave=()=>{
  const f={name:V('sn_name'),cell:V('sn_cell'),company:V('sn_co'),city:V('sn_city'),biz:V('sn_biz'),email:V('sn_email').toLowerCase(),p:$('#sn_pass').value,st:V('sn_st')};

/* --- billing --- */
const BF={st:''};
function billList(){
  let b=DB.billing.slice().sort((a,c)=>c.dueDate.localeCompare(a.dueDate));
  if(BF.st==='due')b=b.filter(x=>x.status==='due'&&!isOver(x));else if(BF.st==='overdue')b=b.filter(isOver);else if(BF.st==='paid')b=b.filter(x=>x.status==='paid');
  return b.length?`<div class="cgrid">${b.map(x=>billCard(x,true)).join('')}</div>`:'<div class="empty small">No bills found.</div>';
}

  const all=DB.billing,unpaid=sumP(all.filter(b=>b.status==='due'),b=>b.amount),over=sumP(all.filter(isOver),b=>b.amount),rec=sumP(all.filter(b=>b.status==='paid'),b=>b.amount);

A.saSave=()=>{const em=V('sa_email').toLowerCase();if(!em||!V('sa_name'))return toast('Name and login ID are required.','err');if(DB.users.some(u=>u.email.toLowerCase()===em))return toast('A shop user already uses this login ID.','err');const np=$('#sa_pass').value;if(np&&np.length<6)return toast('Super admin password needs at least 6 characters.','err');DB.super.name=V('sa_name');DB.super.email=em;DB.super.cell=V('sa_cell');if(np)DB.super.pass=pw(np);save();toast('Settings saved.');render()};

async function saImport(inp){const f=inp.files[0];if(!f)return;let d;try{d=JSON.parse(await f.text());if(!Array.isArray(d.companies)||!d.super)throw 0}catch(e){inp.value='';return toast('This is not a BizBook full backup.','err')}

A.saReset=()=>confirmBox('Erase every company, user and entry? The super admin login is kept.',()=>{const s=DB.super;DB=seed();DB.super=s;DB.session={role:'super'};save();toast('All data erased.');render()},'Erase everything');

/* ---------- searchable dropdowns: every <select> gets a search box ---------- */
(function(){
  const vd=Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,'value');
  Object.defineProperty(HTMLSelectElement.prototype,'value',{configurable:true,get(){return vd.get.call(this)},set(v){vd.set.call(this,v);ssSync(this)}});
  let panel=null,cur=null,hl=0;
  const SIC='<svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+IC.search+'"/></svg>';
  function ssSync(s){
    const b=s._ssb;if(!b)return;
    const o=s.options[s.selectedIndex],t=o?o.textContent:'',sp=b.firstChild;
    if(sp.textContent!==t)sp.textContent=t;
    b.classList.toggle('ph',!s.value);
    if(b.disabled!==s.disabled)b.disabled=s.disabled;
  }
  function ssEnhance(s){
    if(s._ssb||s.multiple||s.size>1)return;
    const b=document.createElement('button');b.type='button';b.className='sel ssb';b.innerHTML='<span></span>'+SIC;
    b.addEventListener('click',()=>{if(s.disabled)return;if(panel&&cur===s){ssClose();return}ssOpen(s,b)});
    s.classList.add('ss-h');s.after(b);s._ssb=b;ssSync(s);
  }
  function ssClose(){if(panel){panel.remove();panel=null;cur=null}}
  function ssPlace(){
    if(!panel||!cur||!cur._ssb)return;
    const r=cur._ssb.getBoundingClientRect(),vh=window.visualViewport?window.visualViewport.height:window.innerHeight;
    const w=Math.max(r.width,Math.min(280,window.innerWidth-16)),left=Math.min(Math.max(8,r.left),window.innerWidth-w-8);
    const below=vh-r.bottom-8,above=r.top-8,up=below<230&&above>below;
    panel.style.width=w+'px';panel.style.left=left+'px';
    panel.style.maxHeight=Math.max(160,Math.min(340,up?above:below))+'px';
    if(up){panel.style.top='';panel.style.bottom=(window.innerHeight-r.top+4)+'px'}else{panel.style.bottom='';panel.style.top=(r.bottom+4)+'px'}
  }
  function ssOpen(s,b){
    ssClose();cur=s;
    panel=document.createElement('div');panel.className='ssp';
    panel.innerHTML='<div class="search">'+ic('search',18)+'<input type="search" placeholder="Type to search…" autocomplete="off"></div><div class="ssl"></div>';
    document.body.append(panel);
    const inp=panel.querySelector('input'),list=panel.querySelector('.ssl');
    const mark=()=>{const xs=list.querySelectorAll('.pk');xs.forEach((e,i)=>e.classList.toggle('hl',i===hl));if(xs[hl])xs[hl].scrollIntoView({block:'nearest'})};
    const draw=()=>{
      const q=inp.value.toLowerCase().trim();let h='';
      Array.from(s.options).forEach((o,i)=>{if(q&&!o.textContent.toLowerCase().includes(q))return;h+=`<button type="button" class="pk${i===s.selectedIndex?' on':''}" data-i="${i}"${o.disabled?' disabled':''}>${esc(o.textContent)||'—'}</button>`});
      list.innerHTML=h||'<div class="empty small">Nothing found.</div>';hl=0;mark();
    };
    const pick=i=>{const o=s.options[i];if(!o||o.disabled)return;const ch=s.selectedIndex!==i;s.selectedIndex=i;ssSync(s);ssClose();if(ch)s.dispatchEvent(new Event('change',{bubbles:true}))};
    list.addEventListener('click',e=>{const x=e.target.closest('.pk');if(x)pick(+x.dataset.i)});
    inp.addEventListener('input',draw);
    inp.addEventListener('keydown',e=>{
      const xs=list.querySelectorAll('.pk');
      if(e.key==='Escape'){e.preventDefault();ssClose()}
      else if(e.key==='ArrowDown'){e.preventDefault();hl=Math.min(xs.length-1,hl+1);mark()}
      else if(e.key==='ArrowUp'){e.preventDefault();hl=Math.max(0,hl-1);mark()}
      else if(e.key==='Enter'){e.preventDefault();if(xs[hl])pick(+xs[hl].dataset.i)}
    });
    if(s.dataset.add&&typeof addOK==='function'&&addOK(s)&&A['add_'+s.dataset.add]){const ad=document.createElement('button');ad.type='button';ad.className='lnk ssadd';ad.textContent='+ '+(s.dataset.addlabel||'Add new');ad.addEventListener('click',()=>{ssClose();A['add_'+s.dataset.add](s)});panel.append(ad)}
    draw();ssPlace();
    const sel=list.querySelector('.pk.on');if(sel)sel.scrollIntoView({block:'nearest'});
    setTimeout(()=>{try{inp.focus({preventScroll:true})}catch(e){inp.focus()}},30);
  }
  document.addEventListener('pointerdown',e=>{if(panel&&!panel.contains(e.target)&&!(cur&&cur._ssb&&cur._ssb.contains(e.target)))ssClose()},true);
  window.addEventListener('scroll',ssPlace,true);window.addEventListener('resize',ssPlace);
  if(window.visualViewport)window.visualViewport.addEventListener('resize',ssPlace);
  let q=0;
  const run=()=>{q=0;document.querySelectorAll('select').forEach(s=>{ssEnhance(s);ssSync(s)});if(cur&&!document.body.contains(cur))ssClose()};
  new MutationObserver(ms=>{if(q)return;if(ms.every(m=>m.target.closest&&m.target.closest('.ssb,.ssp')))return;q=requestAnimationFrame(run)}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['disabled']});
  run();
})();

/* ================= START ================= */
init();
render();
</script>

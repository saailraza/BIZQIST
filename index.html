<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g9:#052E1D;--g8:#07402A;--g7:#0F5A3A;--g6:#1F7A4F;--gold:#D4A021;--gold2:#F0CF7A;--b0:#FFFDF8;--b1:#FBF7EE;--b2:#F3EBDA;--b3:#E6D9BD;--b4:#CDBB93;--ink:#16251E;--mut:#6C7567;--pos:#17744A;--neg:#A3412B;--warn:#B8832B;--r:14px;--sw:272px;
--serif:'Fraunces',Georgia,'Times New Roman',serif;--sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--b2);color:var(--ink);font:15px/1.45 var(--sans)}
button,input,select,textarea{font-family:inherit}
a{color:var(--g7)}
h1,h2,h3{font-family:var(--serif);margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:25px;line-height:1.15}h2{font-size:19px;line-height:1.2}h3{font-size:17px}
.ic{flex:none;vertical-align:middle}
.mut{color:var(--mut)}.sm{font-size:12.5px}.b{font-weight:700}.r{text-align:right}.c{text-align:center}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.num{font-variant-numeric:tabular-nums}

/* ===== layout: sidebar + main ===== */
.side{position:fixed;top:0;bottom:0;left:0;width:var(--sw);max-width:86vw;background:var(--g8);color:var(--b2);z-index:40;display:flex;flex-direction:column;transform:translateX(-102%);transition:transform .25s ease;box-shadow:6px 0 24px rgba(0,0,0,.25)}
.side.open{transform:none}
.sb-head{padding:calc(env(safe-area-inset-top) + 16px) 16px 14px;display:flex;gap:11px;align-items:center;border-bottom:1px solid var(--g7)}
.sb-head .bn{font-family:var(--serif);font-weight:700;font-size:19px;line-height:1.1;letter-spacing:.12em}
.sb-head .cn{font-size:12px;color:var(--b4);max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-nav{flex:1;overflow-y:auto;padding:6px 10px 14px}.sb-nav{scrollbar-width:none;-ms-overflow-style:none}.sb-nav::-webkit-scrollbar{display:none;width:0;height:0}
.sb-sec{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--b4);margin:16px 10px 5px;opacity:.85;font-weight:700}
.sb-nav a,.sb-nav button.li{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--b3);text-decoration:none;font-size:14.5px;font-weight:600;width:100%;background:none;border:0;cursor:pointer;text-align:left;margin-bottom:2px}
.sb-nav a:hover,.sb-nav button.li:hover{background:rgba(243,235,218,.08)}
.sb-nav a.on{background:rgba(243,235,218,.15);color:#fff}
.sb-nav .tag{margin-left:auto;color:var(--b4);display:flex}
.sb-nav .cntb{margin-left:auto;background:#E8B54A;color:#2c1f00;border-radius:99px;font-size:11.5px;font-weight:700;padding:1px 8px}
.sb-foot{border-top:1px solid var(--g7);padding:11px 14px calc(11px + env(safe-area-inset-bottom));font-size:12.5px;color:var(--b4)}
.sb-foot b{display:block;color:var(--b2);font-size:13.5px}
.scrim{position:fixed;inset:0;background:rgba(10,42,32,.5);z-index:35;display:none}
.scrim.on{display:block}
.main{min-width:0;min-height:100vh}
.hdr{position:sticky;top:0;z-index:20;background:var(--g8);color:var(--b2);padding:calc(env(safe-area-inset-top) + 9px) 14px 9px;display:flex;align-items:center;gap:10px}
.hdr .hb{background:rgba(243,235,218,.12);border-color:transparent;color:var(--b2)}
.hdr .ttl{min-width:0}.hdr .bn{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .cn{font-size:12px;color:var(--b4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .sp{flex:1}
.hdr img.lg{width:36px;height:36px;border-radius:10px;object-fit:cover;background:var(--b2)}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 60px}
.ph{margin:6px 2px 14px}.ph p{margin:5px 0 0;color:var(--mut)}
@media(min-width:700px){.wrap{max-width:900px;padding:18px 22px 60px}}
@media(min-width:1024px){
  .side{transform:none;box-shadow:none;max-width:none}
  .main{margin-left:var(--sw)}
  .hb,.scrim,.scrim.on{display:none!important}
  .wrap{max-width:1120px;padding:24px 32px 70px}
  .hdr{padding-left:28px;padding-right:28px}
  h1{font-size:29px}
}

/* cards, forms */
.card{background:var(--b0);border:1px solid var(--b3);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card>h3,.card>h2{margin-bottom:10px}
.fld{margin-bottom:11px}
.fld label,.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--g7);margin-bottom:4px}
input,select,textarea{width:100%;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--b4);border-radius:10px;padding:10px 12px;min-height:46px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--g6);box-shadow:0 0 0 3px rgba(43,107,85,.18)}
input[disabled],select[disabled]{background:var(--b2);color:var(--mut)}
input[type=checkbox]{width:20px;height:20px;min-height:0;padding:0;accent-color:var(--g7);flex:none}
input[type=file]{padding:9px;font-size:14px}
.ms.pk{display:flex;gap:11px;align-items:center}
.ms.pk i{width:21px;height:21px;border:2px solid var(--g7);border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:14px;line-height:1}
.ms.pk.on{background:var(--b1)}.ms.pk.on i{background:var(--g8);border-color:var(--g8)}.ms.pk.on i:after{content:'\2713'}
.mstools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.sb-foot a,.auth .foot a{color:inherit;text-decoration:underline;font-weight:700}
.tk{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--b3);padding:11px 2px;cursor:pointer;color:var(--ink);font:inherit}
.tk .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.tk b{font-size:15px}
.tkm{border-radius:12px;padding:9px 12px;margin:8px 0;font-size:14.5px;white-space:pre-wrap;word-break:break-word}
.tkm.u{background:var(--b1);border:1px solid var(--b3)}.tkm.a{background:#E4F1EA;border:1px solid #BCD9C9}
.tkm small{display:block;color:var(--mut);font-size:11.5px;margin-bottom:3px}
.pwrap{position:relative}.pwrap input{padding-right:48px}
.pwb{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:transparent;color:var(--g7);display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;padding:0}
.pwb:active{background:var(--b2)}
.chk{display:flex;align-items:flex-start;gap:10px;margin:8px 0;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border:0;border-radius:12px;background:var(--g8);color:var(--b1);font:600 15px var(--sans);cursor:pointer;width:100%;text-decoration:none}
.btn:active{background:var(--g9)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--g8);border:1.5px solid var(--g8)}
.btn.tan{background:var(--b3);color:var(--g9)}
.btn.danger{background:var(--neg);color:#fff}
.btn.s{min-height:38px;padding:0 13px;font-size:13.5px;width:auto}
.btn+.btn{margin-top:8px}
.btn.s+.btn.s{margin-top:0}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--b3);background:var(--b1);color:var(--g8);display:inline-grid;place-items:center;cursor:pointer;padding:0}
.ib.red{color:var(--neg)}
.row{display:flex;gap:10px;align-items:center}.row.end{justify-content:flex-end}.row.sb{justify-content:space-between}.row.fw{flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g2 .fld{margin-bottom:0}.g2{margin-bottom:11px}
@media(max-width:380px){.g2.rs{grid-template-columns:1fr}}
.lnk{background:none;border:0;color:var(--g7);font-weight:600;font-size:13px;padding:4px 0;cursor:pointer;text-decoration:underline}
.search{position:relative;margin-bottom:10px}.search input{padding-left:40px}.search .ic{position:absolute;left:12px;top:13px;color:var(--mut)}
.sel{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--b4);border-radius:10px;background:#fff;font-size:16px;text-align:left;cursor:pointer;color:var(--ink)}
.sel span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel.ph span{color:var(--mut)}.sel .ic{color:var(--mut)}
.pklist{max-height:52vh;overflow:auto;margin:0 -4px}
.pk{display:block;width:100%;text-align:left;padding:12px 8px;border:0;border-bottom:1px solid var(--b3);background:none;font-size:15px;cursor:pointer;color:var(--ink)}
.pk:hover,.pk:active{background:var(--b2)}

/* badges + banners */
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.st-full{background:#CFE5DA;color:#07402A}.st-partial{background:#E8DAB4;color:#5C4510}.st-trial{background:#F6E3B0;color:#6A4A06}.st-suspended,.st-rejected{background:#EFCFC6;color:#7A2A18}.st-pending{background:#D5DEEA;color:#27415F}
.t-Income{background:#CFE5DA;color:#07402A}.t-Expense{background:#EFCFC6;color:#7A2A18}
.banner{border-radius:12px;padding:11px 13px;margin-bottom:12px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:#F6E3B0;color:#5A3F05}.banner.bad{background:#EFCFC6;color:#6B2413}.banner.info{background:#D5DEEA;color:#27415F}
.banner a{font-weight:700}
.empty{text-align:center;padding:26px 14px;color:var(--mut)}.empty.small{padding:16px}
.empty h2{color:var(--ink);margin:10px 0 6px}

/* dashboard */
.hero{background:var(--g8);color:var(--b2);border-radius:20px;padding:18px 16px 16px 30px;margin-bottom:12px;position:relative;overflow:hidden;background-image:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(243,235,218,.08) 31px 32px)}
.hero:before{content:'';position:absolute;left:16px;top:0;bottom:0;width:1px;background:rgba(205,187,147,.45)}
.hero .k{font-size:13px;color:var(--b4)}
.hero .big{font-family:var(--serif);font-size:38px;font-weight:700;line-height:1.1;margin:2px 0 10px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;flex-wrap:wrap}

.pos-paper table{width:100%;border-collapse:collapse}
.pos-paper th,.pos-paper td{padding:1px 0;vertical-align:top;font-size:inherit;font-weight:400;border:0;background:none;text-transform:none;letter-spacing:0;color:#000}
.pos-paper th{border-bottom:1px solid #000;font-weight:700;text-align:left}.pos-paper .r{text-align:right}
.pos-paper .pr{display:flex;justify-content:space-between;gap:6px}.pos-paper .pr span:last-child{text-align:right}
.pos-paper .tot{border-top:1px solid #000;border-bottom:1px solid #000;margin:3px 0;padding:2px 0}
.pos-paper .it{margin-bottom:2px}.pos-paper small{font-size:.82em}
.pos-paper .bc{margin-top:6px;text-align:center}.pos-paper .bc svg{margin:0 auto;max-width:100%}
.pgbrk{page-break-after:always;height:0}
body.printing #printSheet.pos{max-width:none;padding:10px 0;background:#E4E0D3;text-align:center}
body.printing #printSheet.pos .bar{justify-content:center}
body.printing #printSheet.lblmode{max-width:none;padding:10px;background:#fff}
.lblsheet{display:flex;flex-wrap:wrap;gap:3mm;align-items:flex-start}
.plbl{box-sizing:border-box;padding:1.5mm 2mm;display:flex;flex-direction:column;justify-content:space-between;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;overflow:hidden;border:1px dashed #bbb}
.plbl .pl-n{font-size:8pt;font-weight:700;line-height:1.1;max-height:2.3em;overflow:hidden}
.plbl .pl-c{font-size:7pt;text-align:center;letter-spacing:.4px}
.plbl .pl-p{font-size:10pt;font-weight:800;text-align:center}
.plbl .pl-b{width:100%}.plbl .pl-b svg{width:100%}.plbl>*{flex-shrink:0}.plbl.bar .pl-n{white-space:nowrap;text-overflow:ellipsis;overflow:hidden;max-height:none;text-align:center}.pos-paper td.r,.pos-paper th.r{padding-left:6px}
.plbl.qr{flex-direction:row;gap:2mm;align-items:center}
.plbl .pl-t{flex:1;display:flex;flex-direction:column;gap:1mm;min-width:0}
.plbl.qr .pl-p,.plbl.qr .pl-c{text-align:left}
@media print{
  body.printing #printSheet.pos{background:#fff;padding:0}
  body.printing #printSheet.lblmode{padding:0}
  .pos-paper{box-shadow:none;display:block;margin:0}
  .lblsheet{gap:0}.lblsheet.roll .plbl{page-break-after:always;break-after:page;border:0}
  .lblsheet.a4{gap:2mm}.lblsheet.a4 .plbl{break-inside:avoid}
  #printSheet .foot{display:none}
}

<script>
'use strict';
/* ================= BIZQIST (BizBook + Installments) by BIZEASE Solutions ================= */
const KEY='bizease_bizbook_v1'; /* same storage key on purpose: existing data keeps working after the rename */
let DB=null,memOnly=false,QS={};
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-5);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const fmt=n=>{n=r2(n);if(n===0)return '0';return (n<0?'-':'')+Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:2})};
const money=n=>'Rs '+fmt(n);
const ymd=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const today=()=>ymd(new Date());
const monthStart=()=>today().slice(0,8)+'01';
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const addMonths=(s,n)=>{const d=new Date(s+'T00:00:00'),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return ymd(d)};
const dmy=d=>d?d.split('-').reverse().join('-'):'';
const dts=t=>{const d=new Date(t);return dmy(ymd(d))+' '+d.toTimeString().slice(0,5)};
const V=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
const TYPES=['Income','Expense','Asset','Liability','Equity','Bank','Cash'];
const BIZ=['Retail shop','General store','Wholesale','Pharmacy','Restaurant / café','Services','Manufacturing','Other'];
const PTYPES=['Customer','Supplier','Employee','Other'];
const ST={pending:'Approval pending',trial:'Free trial',partial:'Partial access',full:'Full access',suspended:'Blocked',rejected:'Rejected'};
const PLANS=['trial','partial','full'];
const MODS=[['voucher','Journal Voucher'],['costcenter','Cost center'],['advreports','Ledger, trial balance, statements, balance sheet'],['trade','Items, sale & purchase, stock'],['qist','Installments (qist): installment sales, due list, customer-wise report']];
const PLAN_DEF={trial:{users:3,mods:['voucher','costcenter','advreports','trade','qist']},partial:{users:3,mods:[]},full:{users:10,mods:['voucher','costcenter','advreports','trade','qist']}};
const TRIAL_DAYS=7,BILL_ADVANCE=7;
const DRN=['Asset','Expense','Cash','Bank'];
const bal=(t,dr,cr)=>DRN.includes(t)?dr-cr:cr-dr;

/* ---------- hashing (offline demo-level) ---------- */
function hash(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
const pw=p=>hash('bz~'+p);

/* ---------- storage ---------- */
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){memOnly=true}return null}
/* Built-in admin: works on every browser/laptop, even when the saved data (localStorage) is empty or has a different admin password. */
const BUILTIN_ADMIN={email:'admin@bizease.com',pass:pw('BizEase@123')};
function seed(){return{v:2,super:{name:'BIZEASE Admin',email:'admin@bizease.com',pass:pw('BizEase@123'),cell:''},companies:[],users:[],coa:[],parties:[],entries:[],vouchers:[],costCenters:[],items:[],trades:[],qpays:[],billing:[],requests:[],logs:[],tickets:[],seq:{},session:null}}
function save(){if(memOnly)return;try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){memOnly=true;toast('Storage is not available. Data will be lost when you close this page.','err')}}
const billNo=()=>{DB.seq._bill=(DB.seq._bill||0)+1;return 'INV-'+String(DB.seq._bill).padStart(4,'0')};
function normalize(){
  ['companies','users','coa','parties','entries','vouchers','costCenters','items','trades','qpays','billing','requests','logs','tickets'].forEach(k=>{DB[k]=DB[k]||[]});
  DB.seq=DB.seq||{};DB.super=DB.super||seed().super;DB.super.cell=DB.super.cell||'';
  DB.companies.forEach(c=>{
    if(!Array.isArray(c.modules))c.modules=c.status==='partial'?[]:MODS.map(m=>m[0]);
    if(!c.tradeAdded){c.tradeAdded=true;if((c.status==='trial'||c.status==='full')&&!c.modules.includes('trade'))c.modules.push('trade')}
    DB.users.forEach(u=>{if(u.perms&&u.perms['r-pl']&&u.perms.plstmt===undefined)u.perms.plstmt=true});
    if(!c.qistAdded){c.qistAdded=true;if((c.status==='trial'||c.status==='full')&&!c.modules.includes('qist'))c.modules.push('qist');if(c.modules.includes('qist')&&!c.modules.includes('trade'))c.modules.push('trade')}
    if(c.maxUsers==null)c.maxUsers=10;
    if(c.fee==null)c.fee=0;
    if(c.nextDue==null)c.nextDue='';
    if(!Array.isArray(c.cashHeads))c.cashHeads=DB.coa.filter(h=>h.companyId===c.id&&(h.type==='Cash'||h.type==='Bank')).map(h=>h.id);
  });
  DB.users.forEach(migratePerms);
  DB.costCenters=migrateCC(DB.costCenters,[DB.entries,DB.vouchers]);
  DB.companies.forEach(c=>{
    if(!Array.isArray(c.receiptHeads))c.receiptHeads=(c.cashHeads||[]).slice();
    if(!Array.isArray(c.paymentHeads))c.paymentHeads=(c.cashHeads||[]).slice();
    syncCash(c);
  });
  DB.billing.forEach(b=>{if(!b.dueDate){b.dueDate=b.date||today();b.issueDate=b.dueDate;b.status='paid';b.paidAt=b.at||Date.now();b.no=b.no||billNo();b.monthly=false;b.auto=false}});
}
/* cost center v3: a cost center has a name + a list of values; lines store {ccId:value} in r.cc */
function migrateCC(ccs,lists){
  const out=[],byKey={},map={};
  (ccs||[]).forEach(c=>{
    if(!('value' in c)&&Array.isArray(c.values)){out.push(c);return}
    const k=(c.companyId||'')+'|'+String(c.name||'').toLowerCase();
    let n=byKey[k];if(!n){n=byKey[k]={id:uid(),companyId:c.companyId,name:c.name,values:[]};out.push(n)}
    if(c.value&&!n.values.includes(c.value))n.values.push(c.value);
    map[c.id]={cc:n.id,v:c.value};
  });
  lists.forEach(l=>(l||[]).forEach(x=>(x.rows||[]).forEach(r=>{
    if(r.c1===undefined&&r.c2===undefined)return;
    r.cc=r.cc||{};
    ['c1','c2'].forEach(f=>{const m=map[r[f]];if(m&&m.v)r.cc[m.cc]=m.v;delete r[f]});
  })));
  return out;
}
const syncCash=c=>{c.cashHeads=[...new Set([...(c.receiptHeads||[]),...(c.paymentHeads||[])])]};
/* permanent test login: Login ID  biztest  /  password  123456  (full-access company, re-created automatically if it is ever missing) */
const TEST_LOGIN={email:'biztest',pass:'123456',company:'BizTest Company'};
function ensureTestUser(){
  let c=DB.companies.find(x=>x.isTest);
  if(!c){
    const f={company:TEST_LOGIN.company,name:'Biz Test',cell:'03000000000',city:'Rawalpindi',biz:'Retail shop',email:TEST_LOGIN.email,p:TEST_LOGIN.pass};
    if(DB.companies.some(x=>x.name.toLowerCase()===f.company.toLowerCase()))f.company+=' (test)';
    const r=mkCompany(f,'full');c=r.c;c.isTest=true;c.tradeAdded=true;c.qistAdded=true;c.fee=0;c.nextDue='';c.maxUsers=10;
    if(!DB.users.some(u=>u.id!==r.user.id&&u.email.toLowerCase()===TEST_LOGIN.email))return save();
    DB.users=DB.users.filter(u=>u.id!==r.user.id);DB.companies=DB.companies.filter(x=>x!==c);DB.coa=DB.coa.filter(h=>h.companyId!==c.id);return;
  }
  if(!DB.users.some(u=>u.companyId===c.id&&u.role==='owner')&&!DB.users.some(u=>u.email.toLowerCase()===TEST_LOGIN.email)){
    DB.users.push({id:uid(),companyId:c.id,name:'Biz Test',cell:'03000000000',email:TEST_LOGIN.email,pass:pw(TEST_LOGIN.pass),role:'owner',active:true,perms:{},at:Date.now()});save();
  }
}
function init(){DB=load()||seed();normalize();ensureTestUser()}

function toast(m,t){const e=document.createElement('div');e.className='toast '+(t||'');e.textContent=m;$('#toasts').append(e);setTimeout(()=>e.remove(),3600)}

/* groups loose fields of a form into a compact grid (cells only as wide as needed) */
function fmEnhance(root){
  (root||document).querySelectorAll('.card,.sheet,.au-card.wide').forEach(c=>{
    if(c.classList.contains('fm'))return;
    const f=[];[...c.children].forEach(ch=>{if(ch.classList&&ch.classList.contains('fld'))f.push(ch);else if(ch.classList&&ch.classList.contains('g2'))[...ch.children].forEach(x=>{if(x.classList.contains('fld'))f.push(x)})});
    if(f.length<2)return;
    c.classList.add('fm');
    f.forEach(x=>{const l=(x.querySelector('label')||{}).textContent||'';if(/note|address|narration|remarks|description|reason|message/i.test(l))x.classList.add('wide')});
  });
}
function modal(h){$('#modal').innerHTML='<div class="sheet">'+h+'</div>';$('#modal').classList.add('on');fmEnhance($('#modal'))}
function closeModal(){if(typeof camOff==='function')camOff();$('#modal').classList.remove('on');$('#modal').innerHTML='';closeModal2()}
function modal2(h){$('#modal2').innerHTML='<div class="sheet">'+h+'</div>';$('#modal2').classList.add('on');fmEnhance($('#modal2'));setTimeout(()=>{const e=$('#modal2 input');if(e&&e.type!=='date')e.focus()},60)}
function closeModal2(){const m=$('#modal2');if(m){m.classList.remove('on');m.innerHTML=''}}
function confirmBox(msg,yes,label,cls){modal(`<h3>Please confirm</h3><p>${msg}</p><div class="row end"><button class="btn ghost s" data-a="closeModal">Cancel</button><button class="btn ${cls||'danger'} s" id="cfYes">${label||'Delete'}</button></div>`);$('#cfYes').onclick=()=>{closeModal();yes()}}

function download(name,text,mime,bom){const b=new Blob([(bom?'\ufeff':'')+text],{type:mime||'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600)}
const csvCell=v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCSV=rows=>rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
function parseCSV(t){const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);rows.push(r);r=[];c=''}else c+=ch}if(c!==''||r.length){r.push(c);rows.push(r)}return rows.filter(x=>x.some(y=>String(y).trim()!==''))}

/* ---------- billing engine ---------- */
function mkBill(cid,amount,due,note,monthly,auto){return{id:uid(),no:billNo(),companyId:cid,amount:r2(amount),issueDate:today(),dueDate:due,status:'due',paidAt:0,note:note||'',monthly:!!monthly,auto:!!auto,at:Date.now()}}
function autoBilling(){
  let ch=false;
  DB.companies.forEach(c=>{
    if((c.status==='full'||c.status==='partial')&&c.fee>0&&c.nextDue&&today()>=addDays(c.nextDue,-BILL_ADVANCE)&&!DB.billing.some(b=>b.companyId===c.id&&b.monthly&&b.dueDate===c.nextDue)){
      DB.billing.push(mkBill(c.id,c.fee,c.nextDue,'Monthly plan fee ('+ST[c.status]+')',true,true));ch=true;
    }
  });
  if(ch)save();
}
const isOver=b=>b.status==='due'&&b.dueDate<today();
const overdueBills=c=>DB.billing.filter(b=>b.companyId===c.id&&isOver(b));
const dueAmt=cid=>DB.billing.filter(b=>b.companyId===cid&&b.status==='due').reduce((s,b)=>s+b.amount,0);

function postings(){

  DB.entries.forEach(e=>{if(e.companyId!==cid)return;const isR=e.kind==='receipt',tot=entTotal(e),vt=isR?'Receipt':'Payment';

    out.push({date:e.date,no:e.no,vtype:vt,kind:e.kind,head:e.account,party:'',slip:'',cc:{},dr:isR?tot:0,cr:isR?0:tot,memo,eid:e.id});
    e.rows.forEach(r=>{const a=num(r.amount);out.push({date:e.date,no:e.no,vtype:vt,kind:e.kind,head:r.head,party:r.party||'',slip:r.slip||'',cc:r.cc||{},dr:isR?0:a,cr:isR?a:0,memo:headName(e.account),eid:e.id})})});
  DB.vouchers.forEach(v=>{if(v.companyId!==cid)return;v.rows.forEach(l=>out.push({date:v.date,no:v.no,vtype:v.type,kind:'voucher',head:l.head,party:l.party||'',slip:l.slip||'',cc:l.cc||{},dr:num(l.dr),cr:num(l.cr),memo:'',eid:v.id}))});

/* Party balance rule: a Customer can never go below 0 (cannot receive more than they owe),
   a Supplier can never go above 0 (cannot pay more than you owe). Employee / Other: may not cross zero
   to the opposite side of where they are. Like the cash check, only a change that makes things worse is blocked. */
function partyCheck(add,excludeId,ovr){
  const all=postings(),base=all.filter(p=>p.eid!==excludeId),gone=all.filter(p=>p.eid===excludeId);
  const ids=[...new Set([...add,...gone].map(p=>p.party).filter(Boolean).concat(ovr?[ovr.id]:[]))];
  for(const id of ids){
    const pt0=DB.parties.find(x=>x.id===id);if(!pt0)continue;
    const mk=(pt,list,side)=>{
      const m={};list.filter(p=>p.party===id).forEach(p=>{m[p.date]=(m[p.date]||0)+p.dr-p.cr});
      const viol=r=>pt.type==='Customer'?Math.max(0,-r):pt.type==='Supplier'?Math.max(0,r):side>0?Math.max(0,-r):side<0?Math.max(0,r):0;
      let run=num(pt.opening),worst=viol(run),at='';
      Object.keys(m).sort().forEach(d=>{run+=m[d];const v=viol(run);if(v>worst+0.0001){worst=v;at=d}});
      return{worst:r2(worst),at,final:r2(run)};
    };
    const fin0=mk(pt0,base.concat(gone),0).final,side=fin0>0.004?1:fin0<-0.004?-1:0;
    const pt1=ovr&&ovr.id===id?{...pt0,...ovr}:pt0;
    const before=mk(pt0,base.concat(gone),side),after=mk(pt1,base.concat(add),side);
    if(after.worst>before.worst+0.005){
      const without=mk(pt1,base,side).final,nm='“'+pt0.name+'”';
      const cust=pt1.type==='Customer'||(pt1.type!=='Supplier'&&side>=0);
      return cust?`${nm} balance would go below zero${after.at?' on '+dmy(after.at):''}. Receivable from ${pt0.name} is ${money(Math.max(0,without))}, so you can receive or adjust at most that much.`
                 :`${nm} balance would go above zero${after.at?' on '+dmy(after.at):''}. Payable to ${pt0.name} is ${money(Math.max(0,-without))}, so you can pay or adjust at most that much.`;
    }
  }
  return '';
}

const vParty=(date,rows)=>rows.filter(r=>r.party).map(r=>({date,party:r.party,dr:num(r.dr),cr:num(r.cr)}));
function openMsg(type,o){if(type==='Customer'&&o<0)return 'A customer’s opening balance cannot be negative. Enter the amount the customer owes you.';if(type==='Supplier'&&o>0)return 'For a supplier, enter the opening balance as a negative number (the amount you owe them).';return ''}
function partyBalMap(posts){const m={};mine('parties').forEach(p=>m[p.id]=num(p.opening));posts.forEach(p=>{if(p.party&&p.party in m)m[p.party]+=p.dr-p.cr});return m}
function plCalc(posts,from,to){const inc={},exp={};posts.forEach(p=>{if((from&&p.date<from)||(to&&p.date>to))return;const t=typeOf(p.head);if(t==='Income')inc[p.head]=(inc[p.head]||0)+p.cr-p.dr;else if(t==='Expense')exp[p.head]=(exp[p.head]||0)+p.dr-p.cr});const si=Object.values(inc).reduce((a,b)=>a+b,0),se=Object.values(exp).reduce((a,b)=>a+b,0);return{inc,exp,income:si,expense:se,net:si-se}}

/* keep the sidebar menu where it was after every click (render rebuilds the whole page) */
function render(){
  const nav=document.querySelector('.sb-nav'),st=nav?nav.scrollTop:0;
  renderPage();
  const n2=document.querySelector('.sb-nav');
  if(n2){n2.scrollTop=st;const on=n2.querySelector('a.on');if(on){const r=on.getBoundingClientRect(),q=n2.getBoundingClientRect();if(r.top<q.top||r.bottom>q.bottom)on.scrollIntoView({block:'nearest'})}}
}
function renderPage(){
  if(document.body.classList.contains('printing'))closePrint();
  closeModal();
  const parts=(location.hash||'#/').replace(/^#\//,'').split('?'),h=parts[0];
  QS=Object.fromEntries(new URLSearchParams(parts[1]||''));
  const app=$('#app');
  autoBilling();
  if(!DB.session){const r=AUTH[h]?h:'login';app.innerHTML=AUTH[r]();window.scrollTo(0,0);return}
  if(isSuper()){
    DB.companies.forEach(refreshStatus);
    const r=SP[h]?h:'s-companies',d=SP[r];
    app.innerHTML=frame(sideSuper(d.nav||r),'BIZEASE SOLUTIONS','','',d.f());
    fmEnhance(app);if(d.mount)d.mount();window.scrollTo(0,0);return;
  }
  const u=me(),c=co();
  if(!u||!c||!u.active){DB.session=null;save();return render()}
  refreshStatus(c);
  const bi=blockInfo(c);
  if(!bi&&c.modules.includes('trade')&&!(c.sys&&c.sys.inv&&c.sys.qinc&&c.sys.qexp))ensureTradeHeads(c);
  if(bi){app.innerHTML=blockedScreen(c,bi,u);window.scrollTo(0,0);return}
  const r=P[h]?h:'home',d=P[r];let body,ok=false;
  if(d.admin&&u.role!=='owner')body=denied('Only the company admin can open this page.');
  else if(d.perm&&!can(d.perm))body=denied('Your admin has not given you access to this page.');
  else if(d.mod&&!hasMod(d.mod))body=locked();
  else{body=d.f();ok=true}
  app.innerHTML=frame(sideUser(r),esc(c.name),'',`<span class="badge st-${c.status}">${ST[c.status]}</span>`,banner(c)+body);
  fmEnhance(app);
  if(ok&&d.mount)d.mount();
  window.scrollTo(0,0);
}

/* Reset mail is sent through EmailJS (https://www.emailjs.com). Fill these 3 values once and password reset by email will work. */
const MAIL={serviceId:'',templateId:'',publicKey:''};
function genPass(){const ch='ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789',a=new Uint32Array(10);crypto.getRandomValues(a);return Array.from(a,n=>ch[n%ch.length]).join('')}
async function sendResetMail(to,name,np){
  if(!MAIL.serviceId||!MAIL.templateId||!MAIL.publicKey)throw new Error('nomail');
  const r=await fetch('https://api.emailjs.com/api/v1.0/email/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service_id:MAIL.serviceId,template_id:MAIL.templateId,user_id:MAIL.publicKey,template_params:{to_email:to,to_name:name,new_password:np,app_name:'BIZQIST'}})});
  if(!r.ok)throw new Error('send');
}
A.doForgot=async(d,el)=>{

  const fus=DB.users.filter(x=>x.email.toLowerCase()===email);
  if(!fus.length)return toast('This email is not registered.','err');

  fus.forEach(u=>{u.pass=pw(np)});save();toast('A new password has been sent to your email.');go('login');
};

  return `<div class="hero"><div class="k">Money in hand (receipt / payment accounts)</div><div class="big">${money(cash)}</div><div class="chips">${accs.map(a=>`<div class="chip">${esc(a.h.head)}<b>${fmt(a.b)}</b></div>`).join('')||'<div class="chip">Add accounts in Settings</div>'}</div></div>
  ${quick}${qDash()}
  <div class="stats"><div class="stat"><div class="k">Received today</div><div class="v pos">${fmt(rToday)}</div></div><div class="stat"><div class="k">Paid today</div><div class="v neg">${fmt(pToday)}</div></div><div class="stat"><div class="k">Profit this month</div><div class="v ${pl.net<0?'neg':''}">${fmt(pl.net)}</div></div><div class="stat"><div class="k">To collect / to pay</div><div class="v" style="font-size:17px">${fmt(ar)} / ${fmt(ap)}</div></div>${tstat}</div>
  <div class="dgrid two"><div class="card"><div class="row sb"><h3>Last 7 days</h3><div class="leg"><span><i style="background:var(--g7)"></i>In</span><span><i style="background:var(--b4)"></i>Out</span></div></div><div class="bars">${days.map(x=>`<div class="bcol"><div class="bp"><i class="br" style="height:${x.r/mx*100}%"></i><i class="bq" style="height:${x.p/mx*100}%"></i></div><span>${DAYN[new Date(x.d+'T00:00:00').getDay()]}</span></div>`).join('')}</div></div>

async function coaImport(inp){
  const f=inp.files[0];if(!f)return;
  try{
    let rows;
    if(/\.csv$/i.test(f.name))rows=parseCSV(await f.text());
    else{await loadSheetJS();const wb=XLSX.read(await f.arrayBuffer());rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''})}
    let add=0,skip=0;
    rows.forEach((r,i)=>{const h=String(r[0]||'').trim(),t0=String(r[1]||'').trim();if(!h)return;if(i===0&&/account|head/i.test(h)&&/type/i.test(t0))return;
      const t=TYPES.find(x=>x.toLowerCase()===t0.toLowerCase());
      if(!t||mine('coa').some(x=>x.head.toLowerCase()===h.toLowerCase())){skip++;return}
      DB.coa.push({id:uid(),companyId:CID(),head:h,type:t});add++});
    if(add)logAct('Accounts imported',add+' account(s)');save();toast(`${add} account(s) added${skip?', '+skip+' skipped (duplicate or unknown type)':''}.`,add?'':'err');render();
  }catch(e){toast('Could not read this file. Excel needs internet once; CSV works offline.','err')}
}

/* ================= BACKDATE LOCK + NO-NEGATIVE CASH/BANK ================= */
const lockDate=()=>co().lockDate||'';
const isLocked=d=>!!(lockDate()&&d&&d<=lockDate());
const lockMsg=()=>'Entries dated on or before '+dmy(lockDate())+' are locked. Nothing can be added, edited or deleted on those dates.';
const isCashHead=id=>{const h=headById(id);return !!h&&(h.type==='Cash'||h.type==='Bank'||co().cashHeads.includes(id))};
const entSim=(kind,date,account,rows)=>{const R=kind==='receipt',tot=rows.reduce((a,r)=>a+num(r.amount),0),o=[{date,head:account,dr:R?tot:0,cr:R?0:tot}];rows.forEach(r=>{const a=num(r.amount);o.push({date,head:r.head,dr:R?0:a,cr:R?a:0})});return o};
const vSim=(date,rows)=>rows.map(l=>({date,head:l.head,dr:num(l.dr),cr:num(l.cr)}));
/* returns an error text if the change would push a cash/bank account below zero (and makes it worse than before) */
function negCheck(add,excludeId){
  const all=postings(),base=all.filter(p=>p.eid!==excludeId),gone=all.filter(p=>p.eid===excludeId);
  const heads=[...new Set([...add,...gone].map(p=>p.head))].filter(isCashHead);
  const walk=(list,from)=>{const m={};list.filter(p=>p.date>=from).forEach(p=>{m[p.date]=(m[p.date]||0)+p.dr-p.cr});let run=0,min=Infinity,at='';const pre=list.filter(p=>p.date<from).reduce((a,p)=>a+p.dr-p.cr,0);run=pre;Object.keys(m).sort().forEach(d=>{run+=m[d];if(d>=from&&run<min){min=run;at=d}});if(min===Infinity){min=run;at=from}return{min:r2(min),at}};
  for(const h of heads){
    const A=add.filter(p=>p.head===h),G=gone.filter(p=>p.head===h),dates=[...A,...G].map(p=>p.date).sort(),from=dates[0];
    const b=base.filter(p=>p.head===h),before=walk(b.concat(G),from),after=walk(b.concat(A),from);
    if(after.min<-0.005&&after.min<before.min-0.005){
      const avail=r2(b.filter(p=>p.date<=after.at).reduce((a,p)=>a+p.dr-p.cr,0));
      return '“'+headName(h)+'” does not have enough balance. Balance on '+dmy(after.at)+' would become '+fmt(after.min)+'. Available before this entry: '+money(Math.max(0,avail))+'.';
    }
  }
  return '';
}

const TK={sale:{t:'Sale invoice',v:'Sale',pre:'SI',s:1},salereturn:{t:'Sale return',v:'Sale return',pre:'SR',s:-1},purchase:{t:'Purchase invoice',v:'Purchase',pre:'PI',s:1},purchasereturn:{t:'Purchase return',v:'Purchase return',pre:'PR',s:-1}};

function tCalc(t){
  const sub=r2(sumP(t.rows,lineNet)),disc=Math.min(r2(num(t.disc)),sub),taxable=r2(sub-disc),tax=r2(taxable*Math.min(100,Math.max(0,num(t.taxp)))/100),charges=r2(num(t.charges)),qx=r2(num(t.qx)),total=r2(taxable+tax+charges+qx),paid=r2(num(t.paid));

/* stock ledger: weighted-average cost, processed by date (stock-in first on the same day) */
function stockLedger(trs,upto){
  const items={};mine('items').forEach(i=>items[i.id]=i);
  const ev=[];
  Object.values(items).forEach(i=>{if(num(i.openQty)>0)ev.push({d:i.openDate||'0000-00-00',o:0,at:0,op:i})});
  (trs||[]).forEach(t=>ev.push({d:t.date,o:(t.kind==='purchase'||t.kind==='salereturn')?1:2,at:t.at||0,t}));
  ev.sort((a,b)=>a.d.localeCompare(b.d)||a.o-b.o||a.at-b.at);
  const st={},costs={},landed={},moves=[],neg=[],S=id=>st[id]||(st[id]={qty:0,value:0});
  ev.forEach(e=>{
    if(upto&&e.d>upto)return;
    if(e.op){const i=e.op,s=S(i.id),q=q3(num(i.openQty)),v=r2(q*num(i.openRate));s.qty=q3(s.qty+q);s.value=r2(s.value+v);moves.push({item:i.id,date:e.d,no:'OPENING',type:'Opening stock',party:'',inq:q,outq:0,rate:num(i.openRate),bal:s.qty});return}
    const t=e.t,k=t.kind,tot=tCalc(t),n=t.rows.length;
    const share=amt=>{let used=0;return t.rows.map((r,ix)=>{const x=ix===n-1?r2(amt-used):(tot.sub>0?r2(amt*lineNet(r)/tot.sub):0);used=r2(used+x);return x})};
    const dS=share(tot.disc),cS=share(tot.charges);
    costs[t.id]=[];landed[t.id]=[];
    t.rows.forEach((r,ix)=>{
      const s=S(r.item),q=q3(num(r.qty)),ln=lineNet(r),it=items[r.item]||{};
      const avg=s.qty>0?s.value/s.qty:num(it.buy);
      let cost=0,inq=0,outq=0;
      if(k==='purchase'){cost=r2(ln-dS[ix]+cS[ix]);landed[t.id][ix]=cost;s.qty=q3(s.qty+q);s.value=r2(s.value+cost);inq=q}
      else if(k==='salereturn'){cost=r2(q*avg);s.qty=q3(s.qty+q);s.value=r2(s.value+cost);inq=q}
      else{cost=(q>=s.qty&&s.qty>0)?s.value:r2(q*avg);s.qty=q3(s.qty-q);s.value=r2(s.value-cost);outq=q}
      if(s.qty===0&&Math.abs(s.value)<0.01)s.value=0;
      if(s.qty<0)neg.push({item:r.item,date:t.date,no:t.no,qty:s.qty});
      costs[t.id][ix]=cost;
      moves.push({item:r.item,date:t.date,no:t.no,type:TK[k].v,party:partyName(t.party),inq,outq,rate:num(r.rate),bal:s.qty});
    });
  });
  return{stock:st,costs,landed,moves,neg};
}
/* ledger postings of one invoice (double entry, always balanced) */
function tradePosts(t,costs){
  const S=co().sys,k=t.kind,tot=tCalc(t),out=[],ps=partyName(t.party),memo=TK[k].v+(ps?' · '+ps:'');
  const C=r2(sumP(costs||[],x=>x));
  const P=(head,dr,cr,party)=>{dr=r2(dr);cr=r2(cr);if(dr||cr)out.push({date:t.date,no:t.no,vtype:TK[k].v,kind:'trade',head,party:party||'',slip:'',cc:{},dr,cr,memo,eid:t.id})};
  if(k==='sale'){P(t.account,tot.paid,0);P(S.ar,tot.due,0,t.party);P(S.sales,0,tot.taxable);P(S.tax,0,tot.tax);P(S.other,0,tot.charges);P(S.qinc,0,tot.qx);P(S.cogs,C,0);P(S.inv,0,C)}
  else if(k==='salereturn'){P(t.account,0,tot.paid);P(S.ar,0,tot.due,t.party);P(S.sales,tot.taxable,0);P(S.tax,tot.tax,0);P(S.other,tot.charges,0);P(S.inv,C,0);P(S.cogs,0,C)}
  else if(k==='purchase'){P(S.inv,tot.taxable+tot.charges,0);P(S.tax,tot.tax,0);P(S.qexp,tot.qx,0);P(t.account,0,tot.paid);P(S.ap,0,tot.due,t.party)}
  else{const diff=r2(tot.taxable+tot.charges-C);P(t.account,tot.paid,0);P(S.ap,tot.due,0,t.party);P(S.inv,0,C);P(S.tax,0,tot.tax);if(diff>0)P(S.cogs,0,diff);else P(S.cogs,-diff,0)}
  return out;
}
function tradeAllPosts(){

    const b={date:i.openDate,no:'OS-'+(i.code||''),vtype:'Opening stock',kind:'trade',party:'',slip:'',cc:{},memo:'Opening stock · '+i.name,eid:i.id};

/* a sale / purchase may not push stock below zero (unless allowed in Items setup) */
function stockProblem(newT,oldId){
  const c=co();if(c.negStock)return '';
  const list=mine('trades').filter(t=>t.id!==oldId);if(newT)list.push(newT);
  const old=oldId?DB.trades.find(t=>t.id===oldId):null;

}

function readItem(p,id){
  const name=V(p+'_name');if(!name){toast('Enter the item name.','err');return null}
  if(mine('items').some(x=>x.id!==id&&x.name.toLowerCase()===name.toLowerCase())){toast('An item with this name already exists.','err');return null}
  let code=V(p+'_code');
  if(code&&mine('items').some(x=>x.id!==id&&x.code.toLowerCase()===code.toLowerCase())){toast('This item code is already used.','err');return null}
  const o={name,code,category:V(p+'_cat'),unit:V(p+'_unit')||'pcs',tax:Math.max(0,num(V(p+'_tax'))),buy:Math.max(0,num(V(p+'_buy'))),sell:Math.max(0,num(V(p+'_sell'))),min:Math.max(0,num(V(p+'_min'))),openQty:Math.max(0,q3(num(V(p+'_oq')))),openRate:Math.max(0,num(V(p+'_or'))),openDate:V(p+'_od')||today(),openPost:$('#'+p+'_op').checked};
  o.barcode=V(p+'_bar');
  if(o.barcode&&mine('items').some(x=>x.id!==id&&(normC(x.barcode)===normC(o.barcode)||normC(x.code)===normC(o.barcode)))){toast('This barcode is already used by another item.','err');return null}
  if($('#'+p+'_qsell'))o.qsell=Math.max(0,num(V(p+'_qsell')));
  if(o.tax>100){toast('Tax % cannot be more than 100.','err');return null}
  return o;
}

async function itemImport(inp){
  const f=inp.files[0];if(!f)return;
  try{
    const rows=parseCSV(await f.text());let add=0,skip=0;
    rows.forEach((r,ix)=>{const name=String(r[0]||'').trim();if(!name||(ix===0&&/^name$/i.test(name)))return;
      if(mine('items').some(x=>x.name.toLowerCase()===name.toLowerCase())){skip++;return}
      let code=String(r[1]||'').trim();if(!code||mine('items').some(x=>x.code.toLowerCase()===code.toLowerCase()))code=nextNo('ITM');
      const unit=UNITS.find(u=>u===String(r[3]||'').trim().toLowerCase())||'pcs',oq=Math.max(0,q3(num(r[6])));
      const o={id:uid(),companyId:CID(),active:true,at:Date.now(),name,code,category:String(r[2]||'').trim(),unit,tax:0,buy:Math.max(0,num(r[4])),sell:Math.max(0,num(r[5])),min:0,openQty:oq,openRate:Math.max(0,num(r[7])),openDate:today(),openPost:true};
      if(openLocked(o)){skip++;return}
      DB.items.push(o);add++});
    if(add)logAct('Items imported',add+' item(s)');save();toast(add+' item(s) added'+(skip?', '+skip+' skipped':'')+'.',add?'':'err');render();
  }catch(e){toast('Could not read this file.','err')}
}

  if(MD==='credit'&&!t.party)return toast('Choose the '+(isSale(k)?'customer':'supplier')+' for a credit invoice.','err');

/* ================= BIZQIST: PAYMENT MODES + INSTALLMENT (QIST) MODULE ================= */
/* Every invoice has ONE payment mode: Cash, Bank, Credit or Installment.
   Cash / Bank   = full amount paid now through a cash or bank account.
   Credit        = full amount goes to the party account (receivable / payable), no extra charge.
   Installment   = advance now + remaining (plus optional extra %) split into monthly installments.
   Installment sale = receivable from customer, installment purchase = payable to supplier.
   Every installment received / paid is saved as a normal Receipt / Payment entry, so the ledgers always agree. */
const QST={tab:'due',f:'all',q:'',dir:'rec'};
const MODES=[['cash','Cash'],['bank','Bank'],['credit','Credit'],['qist','Installment']];
const qOn=d=>(d.kind==='sale'||d.kind==='purchase')&&d.mode==='qist'&&hasMod('qist');
const qFirst=d=>d.first||addMonths(d.date,1);
const qRate=(it,isQ)=>isQ&&num(it.qsell)>0?num(it.qsell):num(it.sell);
const dayDiff=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const accFor=(k,m)=>{const l=accHeads(tAcc(k)),h=m==='bank'?l.find(x=>x.type==='Bank'):l.find(x=>x.type!=='Bank');return h?h.id:''};
function tModeOf(t){return t.mode||(t.qist?'qist':num(t.paid)<=0.004?'credit':((headById(t.account)||{}).type==='Bank'?'bank':'cash'))}
const tLegacy=t=>{const m=tModeOf(t);return(m==='cash'||m==='bank')&&num(t.paid)>0.004&&num(t.paid)<tCalc(t).total-0.004};
const tModeBadge=t=>{const m=tModeOf(t),cl={cash:'st-full',bank:'st-pending',credit:'st-trial',qist:'st-partial'}[m];return `<span class="badge ${cl}">${(MODES.find(x=>x[0]===m)||[0,m])[1]}</span>`};
function qSplit(rem,months,first){
  const n=Math.max(1,Math.floor(num(months))||1);rem=r2(rem);
  let base=rem/n>=1?Math.round(rem/n):r2(rem/n);
  if(r2(rem-base*(n-1))<0)base=r2(rem/n);
  const out=[];let used=0;
  for(let i=0;i<n;i++){const a=i===n-1?r2(rem-used):base;used=r2(used+a);out.push({n:i+1,due:addMonths(first,i),amt:a})}
  return out;
}
/* invoice total before the installment extra */
const qBase=d=>tCalc({...d,qx:0,paid:0}).total;
function qCalc(base,adv,pct,months,first){
  const fin=r2(base-adv),ex=r2(Math.max(0,fin)*Math.max(0,pct)/100),tot=r2(fin+ex);
  return{fin,ex,tot,rows:tot>0&&months>=1?qSplit(tot,months,first):[]};
}
function qRecalc(d){d.qx=qOn(d)?qCalc(qBase(d),r2(num(d.paid)),num(d.qpct),1,d.date).ex:0}
function qReprice(x,toQ){x.rows.forEach(r=>{const it=itemById(r.item);if(it&&String(r.rate)===String(qRate(it,!toQ)))r.rate=String(qRate(it,toQ))})}

}

/* ----- plans / schedule ----- */
function qPlan(t){
  const c=tCalc(t),rows=qSplit(c.due,t.qist.months,t.qist.first),td=today();
  const pays=DB.qpays.filter(p=>p.tid===t.id).sort((a,b)=>a.date.localeCompare(b.date)||a.at-b.at);
  let pool=r2(sumP(pays,p=>num(p.amount)));
  rows.forEach(s=>{const pd=Math.min(s.amt,pool);s.paid=r2(pd);pool=r2(pool-pd);s.left=r2(s.amt-s.paid);s.days=dayDiff(td,s.due);s.late=s.left>0.004&&s.days<0});
  const paid=r2(sumP(rows,s=>s.paid));
  return{t,rows,pays,total:c.total,adv:c.paid,extra:r2(num(t.qx)),rem:c.due,paid,left:r2(c.due-paid),party:t.party||'',pay:t.kind==='purchase'};
}
const qPlans=(dir='rec')=>mine('trades').filter(t=>t.qist&&(dir==='pay'?t.kind==='purchase':t.kind==='sale')).map(qPlan);
function qPending(dir='rec'){
  const out=[];qPlans(dir).forEach(p=>p.rows.forEach(s=>{if(s.left>0.004)out.push({p,s})}));
  return out.sort((a,b)=>a.s.due.localeCompare(b.s.due)||partyName(a.p.party).localeCompare(partyName(b.p.party)));
}
function qStats(dir='rec'){
  const l=qPending(dir),o=l.filter(x=>x.s.late),w=l.filter(x=>!x.s.late&&x.s.days<=7);
  return{o:sumP(o,x=>x.s.left),oc:o.length,w:sumP(w,x=>x.s.left),wc:w.length,all:sumP(l,x=>x.s.left),n:l.length};
}

function qClients(dir){

    x.plans.push(p);x.left=r2(x.left+p.left);x.total=r2(x.total+p.rem);x.paid=r2(x.paid+p.paid);

/* ----- QR code encoder (byte mode, error correction M, versions 1-10) ----- */
const QRG=(()=>{
  const ECC=[-1,10,16,26,18,24,16,18,22,22,26],BLK=[-1,1,1,1,2,2,4,4,4,5,5];
  const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r};
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z};
  const div=d=>{const r=new Array(d).fill(0);r[d-1]=1;let root=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=mul(r[j],root);if(j+1<d)r[j]^=r[j+1]}root=mul(root,2)}return r};
  const rem=(data,dv)=>{const r=dv.map(()=>0);for(const b of data){const f=b^r.shift();r.push(0);dv.forEach((c,i)=>{r[i]^=mul(c,f)})}return r};
  const bit=(x,i)=>((x>>>i)&1)!==0;
  function make(text){
    const bytes=Array.from(new TextEncoder().encode(String(text)));
    let ver=0;for(let v=1;v<=10;v++){const cap=(Math.floor(raw(v)/8)-ECC[v]*BLK[v])*8;if(4+(v<10?8:16)+bytes.length*8<=cap){ver=v;break}}
    if(!ver)return null;
    const size=ver*4+17,cap=(Math.floor(raw(ver)/8)-ECC[ver]*BLK[ver]);
    const bb=[];const put=(val,n)=>{for(let i=n-1;i>=0;i--)bb.push((val>>>i)&1)};
    put(4,4);put(bytes.length,ver<10?8:16);bytes.forEach(b=>put(b,8));
    put(0,Math.min(4,cap*8-bb.length));while(bb.length%8)bb.push(0);
    const data=[];for(let i=0;i<bb.length;i+=8){let x=0;for(let j=0;j<8;j++)x=(x<<1)|bb[i+j];data.push(x)}
    for(let pad=0xEC;data.length<cap;pad^=0xEC^0x11)data.push(pad);
    const nb=BLK[ver],el=ECC[ver],rc=Math.floor(raw(ver)/8),ns=nb-rc%nb,sl=Math.floor(rc/nb),dv=div(el),blocks=[];
    for(let i=0,k=0;i<nb;i++){const dat=data.slice(k,k+sl-el+(i<ns?0:1));k+=dat.length;const ecc=rem(dat,dv);if(i<ns)dat.push(0);blocks.push(dat.concat(ecc))}
    const all=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==sl-el||j>=ns)all.push(b[i])});
    const M=Array.from({length:size},()=>Array(size).fill(false)),F=Array.from({length:size},()=>Array(size).fill(false));
    const setF=(x,y,d)=>{M[y][x]=d;F[y][x]=true};
    for(let i=0;i<size;i++){setF(6,i,i%2===0);setF(i,6,i%2===0)}
    const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),x=cx+dx,y=cy+dy;if(x>=0&&x<size&&y>=0&&y<size)setF(x,y,d!==2&&d!==4)}};
    finder(3,3);finder(size-4,3);finder(3,size-4);
    let pos=[];if(ver>1){const n=Math.floor(ver/7)+2,step=Math.ceil((ver*4+4)/(n*2-2))*2;pos=[6];for(let p=size-7;pos.length<n;p-=step)pos.splice(1,0,p)}
    pos.forEach((a,i)=>pos.forEach((b,j)=>{if((i===0&&j===0)||(i===0&&j===pos.length-1)||(i===pos.length-1&&j===0))return;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)setF(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}));
    const fmt=mask=>{const d=0<<3|mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const bits=((d<<10)|r)^0x5412;
      for(let i=0;i<=5;i++)setF(8,i,bit(bits,i));setF(8,7,bit(bits,6));setF(8,8,bit(bits,7));setF(7,8,bit(bits,8));for(let i=9;i<15;i++)setF(14-i,8,bit(bits,i));
      for(let i=0;i<8;i++)setF(size-1-i,8,bit(bits,i));for(let i=8;i<15;i++)setF(8,size-15+i,bit(bits,i));setF(8,size-8,true)};
    fmt(0);
    if(ver>=7){let r=ver;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const bits=(ver<<12)|r;for(let i=0;i<18;i++){const c=bit(bits,i),a=size-11+i%3,b=Math.floor(i/3);setF(a,b,c);setF(b,a,c)}}
    let k=0;for(let right=size-1;right>=1;right-=2){if(right===6)right=5;for(let v=0;v<size;v++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?size-1-v:v;if(!F[y][x]&&k<all.length*8){M[y][x]=bit(all[k>>>3],7-(k&7));k++}}}
    const mk=(m,x,y)=>[(x+y)%2===0,y%2===0,x%3===0,(x+y)%3===0,(Math.floor(x/3)+Math.floor(y/2))%2===0,x*y%2+x*y%3===0,(x*y%2+x*y%3)%2===0,((x+y)%2+x*y%3)%2===0][m];
    const apply=m=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!F[y][x]&&mk(m,x,y))M[y][x]=!M[y][x]};
    const pen=()=>{let p=0;for(let t=0;t<2;t++)for(let a=0;a<size;a++){let run=1;for(let b=1;b<size;b++){const c=t?M[b][a]:M[a][b],pv=t?M[b-1][a]:M[a][b-1];if(c===pv){run++;if(run===5)p+=3;else if(run>5)p++}else run=1}}
      for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3}
      let d=0;M.forEach(r=>r.forEach(c=>{if(c)d++}));p+=Math.floor(Math.abs(d*20-size*size*10)/(size*size))*10;return p};
    let best=0,bp=1e9;for(let m=0;m<8;m++){apply(m);fmt(m);const q=pen();if(q<bp){bp=q;best=m}apply(m)}
    apply(best);fmt(best);return M;
  }
  return{make};
})();
function qrSVG(text,px){
  const M=QRG.make(text);if(!M)return '<span class="mut sm">QR too long</span>';
  const n=M.length,q=2;let d='';M.forEach((r,y)=>r.forEach((c,x)=>{if(c)d+=`M${x+q} ${y+q}h1v1h-1z`}));
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n+q*2} ${n+q*2}" width="${px||120}" height="${px||120}" shape-rendering="crispEdges" style="background:#fff;display:block"><path d="${d}" fill="#000"/></svg>`;
}

const C128="212222,222122,222221,121223,121322,131222,122213,122312,132212,221213,221312,231212,112232,122132,122231,113222,123122,123221,223211,221132,221231,213212,223112,312131,311222,321122,321221,312212,322112,322211,212123,212321,232121,111323,131123,131321,112313,132113,132311,211313,231113,231311,112133,112331,132131,113123,113321,133121,313121,211331,231131,213113,213311,213131,311123,311321,331121,312113,312311,332111,314111,221411,431111,111224,111422,121124,121421,141122,141221,112214,112412,122114,122411,142112,142211,241211,221114,413111,241112,134111,111242,121142,121241,114212,124112,124211,411212,421112,421211,212141,214121,412121,111143,111341,131141,114113,114311,411113,411311,113141,114131,311141,411131,211412,211214,211232,2331112".split(',');
function code128SVG(text,h,w){
  const t=String(text).replace(/[^\x20-\x7E]/g,'?');let codes=[104],sum=104;
  for(let i=0;i<t.length;i++){const v=t.charCodeAt(i)-32;codes.push(v);sum+=v*(i+1)}
  codes.push(sum%103,106);
  let x=10,rects='';codes.forEach(c=>{const p=C128[c];for(let i=0;i<p.length;i++){const wd=+p[i];if(i%2===0)rects+=`<rect x="${x}" y="0" width="${wd}" height="50"/>`;x+=wd}});
  const tot=x+10;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${tot} 50" preserveAspectRatio="none" width="${w||'100%'}" height="${h||40}" shape-rendering="crispEdges" style="background:#fff;display:block"><g fill="#000">${rects}</g></svg>`;
}

function rsRead(){const g=id=>V('rs_'+id),c=posCfg();return{...c,paper:g('paper')||c.paper,font:g('font')||c.font,shop:g('shop'),addr:g('addr'),phone:g('phone'),gst:g('gst'),taxLabel:g('tl')||'GST',footer:g('foot'),foot2:g('foot2'),copies:g('copies')||'1',bar:$('#rs_bar').checked,cashier:$('#rs_cash').checked,auto:$('#rs_auto').checked,showCode:$('#rs_code').checked,tax0:$('#rs_tax0').checked}}
function rsPrev(){const e=$('#rs_prev');if(e)e.innerHTML=posHtml(posSample(),rsRead())}

  ${F('rs_tl','Tax name',{v:c.taxLabel,attr:on+' placeholder="GST"'})}${F('rs_gst','GST / NTN number',{v:c.gst,attr:on})}
  ${F('rs_foot','Footer message',{v:c.footer,attr:on})}${F('rs_foot2','Second footer line (optional)',{v:c.foot2,attr:on})}${SEL('rs_copies','Copies per print',opts([['1','1'],['2','2'],['3','3']],c.copies))}

  <div class="row fw" style="margin-top:6px"><button class="btn" data-a="rsSave">Save settings</button><button class="btn tan" data-a="rsTest">${ic('print',16)}Test print</button></div></div>

A.rsSave=()=>{co().pos=rsRead();save();toast('Receipt settings saved.')};
A.rsTest=()=>{const c=rsRead();printRaw(posHtml(posSample(),c),{page:c.paper+'mm auto',cls:'pos'})};
